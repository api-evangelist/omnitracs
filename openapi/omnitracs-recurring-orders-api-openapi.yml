      example: Tuesday
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    RecurringOrderContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/RecurringOrder'
      x-omni-valid:
        AlwaysRequired:
        - item
    AssignDaysPassIdentity:
      type: object
      properties:
        entityKey:
          type: integer
          example: 101
        identifier:
          type: string
          example: TESTIDENTIFIER
        description:
          type: string
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
        PostPutPatchOptional:
        - entityKey
        - identifier
    TimeUnitType:
      type: string
      example: Day
      enum:
      - Day
      - Week
      - Month
    Territory:
      allOf:
      - $ref: '#/components/schemas/SessionBasedObject'
      - type: object
        properties:
          area:
            $ref: '#/components/schemas/ServiceArea'
          assignDaysPassIdentity:
            allOf:
            - $ref: '#/components/schemas/AssignDaysPassIdentity'
          color:
            allOf:
            - $ref: '#/components/schemas/Color'
          createTerritoriesPassIdentity:
            allOf:
            - $ref: '#/components/schemas/CreateTerritoriesPassIdentity'
          description:
            type: string
            example: Territory Description
          equipment:
            type: array
            description: Only populated if Equipment expand parameter is set
            items:
              $ref: '#/components/schemas/TerritoryEquipment'
          estimatedNumberOfStops:
            type: integer
          originDepotIdentity:
            allOf:
            - $ref: '#/components/schemas/OriginDepotIdentity'
          teamSplit:
            type: boolean
            example: true
          totalEstimatedRunTime:
            allOf:
            - $ref: '#/components/schemas/Duration'
          totalEstimatedServiceTime:
            allOf:
            - $ref: '#/components/schemas/Duration'
          workers:
            type: array
            description: Only populated if Workers expand parameter is set
            items:
              $ref: '#/components/schemas/TerritoryWorker'
        x-omni-valid:
          PostPutRequired:
          - createTerritoriesPassIdentity
          - equipment
          - originDepotIdentity
          PostPutPatchOptional:
          - assignDaysPassIdentity
          - color
          - description
          - teamSplit
          MonolithicChildCollection:
          - equipment
          - workers
          CalculatedReadonly:
          - area
          - estimatedNumberOfStops
          - totalEstimatedRunTime
          - totalEstimatedServiceTime
    Coordinate:
      type: object
      example:
        latitude: 32.785422
        longitude: -96.79748
      properties:
        latitude:
          type: number
          maximum: 90
          minimum: -90
          example: 32.785422
        longitude:
          type: number
          maximum: 180
          minimum: -180
          example: -96.79748
      x-omni-valid:
        PostPutPatchRequired:
        - latitude
        - longitude
    ErrorContainer:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    Polygon:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/Coordinate'
      x-omni-valid:
        AlwaysRequired:
        - points
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    TimeOfDay:
      type: string
      description: Time of day in HH:MM:SS format.
      example: 36000
    HazmatType:
      type: object
      properties:
        class:
          $ref: '#/components/schemas/HazmatTypeFlags'
        description:
          type: string
          example: class 2 type
      x-omni-valid:
        AlwaysRequired:
        - class
        CalculatedReadonly:
        - description
    Color:
      type: object
      properties:
        alpha:
          type: integer
          example: 0
        blue:
          type: integer
          example: 200
        green:
          type: integer
          example: 200
        red:
          type: integer
          example: 200
      x-omni-valid:
        AlwaysRequired:
        - alpha
        - blue
        - green
        - red
    Duration:
      type: number
      description: Time in seconds
      example: 36000
    WorkerTask:
      type: object
      description: Represents one step of work that needs to be completed to fulfill the Order.
      properties:
        locationIdentity:
          description: When creating or modifying orders and applyLocationSubstitution=true is provided in the request, the location identifier will be used to determine if a substitution exists for the provided location. This will not occur when only an entityKey is provided in the request.
          allOf:
          - $ref: '#/components/schemas/Identity'
        quantities:
          description: If using line item detail, then Quantities are calculated rollups of Line Item Quantities.  Otherwise, they are the set-able Quantities of the Task.
          allOf:
          - $ref: '#/components/schemas/Quantities'
        taskType:
          type: string
          example: Pickup
          enum:
          - Pickup
          - Delivery
        lineItems:
          type: array
          description: Line items that comprise the Order.  Line items are only relevant if the system is configured to use line items.
          items:
            $ref: '#/components/schemas/LineItem'
        priorityOverride:
          type: integer
          description: Overrides a location priority
          maximum: 10
          minimum: 0
          example: 6
        overrides:
          description: Open/Close and Service Window Overrides - note entire override should be supplied on PATCH or PUT, Open/Close and Service Windows can not be separately updated.
          allOf:
          - $ref: '#/components/schemas/ServiceOverrides'
        assignedRouteIdentity:
          description: Identity of the Route that the Order is assigned to
          allOf:
          - $ref: '#/components/schemas/Identity'
      x-omni-valid:
        RequiredRelatedIdentity:
        - locationIdentity
        ReadonlyRelatedIdentity:
        - assignedRouteIdentity
        AlwaysRequired:
        - taskType
        TaskQuantitiesLineItems:
        - lineItems
        - quantities
        PostPutPatchOptional:
        - priorityOverride
        PostPutOptional:
        - overrides
        MonolithicChildCollection:
        - overrides
    Quantities:
      type: array
      maxItems: 3
      minItems: 3
      items:
        type: number
    TerritoryAssignmentResult:
      type: object
      properties:
        constraintsEncountered:
          type: string
        territory:
          allOf:
          - $ref: '#/components/schemas/Identity'
        matchingPatterns:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        errorCodes:
          type: array
          items:
            type: string
      x-omni-valid:
        AlwaysRequired:
        - constraintsEncountered
        - territory
        - matchingPatterns
        - errorCodes
    OriginDepotIdentity:
      type: object
      properties:
        entityKey:
          type: integer
          example: 101
        identifier:
          type: string
          example: TESTIDENTIFIER
        description:
          type: string
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
        PostPutPatchOptional:
        - entityKey
        - identifier
    RecurringOrder:
      allOf:
      - $ref: '#/components/schemas/SessionBasedObject'
      - type: object
        properties:
          previousOriginId:
            type: string
          previousTerritoryId:
            type: string
          previousDays:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/DayOfWeek'
          previousWeek:
            type: integer
            description: Use `previousWeeks` instead. The value provided may not be saved correctly because it is capped by the routing session's week count.
            deprecated: true
          previousWeeks:
            type: array
            description: The weeks in the cycle during which this order was previously routed. Replaces the deprecated `previousWeek` field. Value cannot exceed the number of weeks in the planning session.
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              minimum: 1
          requiredOrigin:
            description: Required route origin.
            allOf:
            - $ref: '#/components/schemas/Identity'
          numberOfDaysToShift:
            type: integer
            maximum: 7
            minimum: 0
            example: 0
          considerForRouting:
            type: boolean
          useAnchorDays:
            type: boolean
          useAnchorWeeks:
            type: boolean
          anchorDaysRange:
            type: integer
            maximum: 7
            minimum: 0
            example: 0
          anchorWeeksRange:
            type: integer
            maximum: 24
            minimum: 0
            example: 20
          additionalServiceTime:
            allOf:
            - $ref: '#/components/schemas/Duration'
          forceBulkServiceTime:
            type: boolean
          orderClassIdentity:
            description: Order Class associates the item with a set of Service Time and Service Window parameters.
            allOf:
            - $ref: '#/components/schemas/Identity'
          servicePatternSetIdentity:
            description: Service Pattern Set associated with the recurring order
            allOf:
            - $ref: '#/components/schemas/Identity'
          currentServicePatternIdentity:
            description: Service Pattern associated with the recurring order
            allOf:
            - $ref: '#/components/schemas/Identity'
          urgency:
            type: integer
            description: The importance of the order, which impacts its preference for the routing algorithms
            maximum: 100
            minimum: 0
            example: 75
          urgencyIncrease:
            type: integer
            description: If needed, the amount to increase the order urgency
            maximum: 100
            minimum: 0
            example: 75
          selector:
            type: string
            format: uppercase
            maxLength: 1
            minLength: 1
            pattern: ^[A-Z]{1}$
            example: S
          isRouted:
            type: boolean
            description: Is the order routed
          cycleTimeUnitType:
            $ref: '#/components/schemas/TimeUnitType'
          cycleNumberOfTimeUnits:
            type: integer
            minimum: 0
          totalDeliveryQuantities:
            description: Calculated rollups
            allOf:
            - $ref: '#/components/schemas/Quantities'
          totalPickupQuantities:
            description: Calculated rollups
            allOf:
            - $ref: '#/components/schemas/Quantities'
          tasks:
            type: array
            description: 'The tasks required to fulfill the Order.


              Depending on the type of Order, different Tasks will be defined:

              + Pickup Order (First/Final Mile pickups from the service location back to the depot) - Contains a single task of TaskType Pickup. **Currently unsupported for Recurring Orders**

              + Delivery Order (First/Final Mile deliveries from the depot to the service location) - Contains a single task of TaskType Delivery

              + Delivery & Pickup (First/Final Mile simultaneous delivery and pickup at the same service location) - Contains two Tasks, one Delivery and one Pickup.  Both tasks reference the same LocationIdentity. **Currently unsupported for Recurring Orders**

              + Transfer (Over-the-Road Loads, and special cases within First/Final Mile) - Contains two Tasks, the first a Pickup and the second a Delivery.  Quantities (and Line items if relevant) must be identical between the two tasks. **Requires that the customer is subscribed to Rolling Horizon**

              '
            items:
              $ref: '#/components/schemas/WorkerTask'
          territories:
            type: array
            items:
              $ref: '#/components/schemas/Territory'
          customProperties:
            type: array
            description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
            items:
              $ref: '#/components/schemas/CustomProperty'
          orderType:
            type: string
            description: The type of order. Available when retrieving orders only. When posting, order type is determined by the tasks included in the order.
            example: Delivery
            enum:
            - None
            - Delivery
            - Pickup
            - DeliveryAndPickup
            - Transfer
        x-omni-valid:
          PostPutRequired:
          - tasks
          - territories
          PostPutPatchOptional:
          - selector
          - urgency
          - urgencyIncrease
          - servicePatternSetIdentity
          - currentServicePatternIdentity
          - cycleTimeUnitType
          - cycleNumberOfTimeUnits
          - previousOriginId
          - previousTerritoryId
          - previousDays
          - previousWeek
          - previousWeeks
          - requiredOrigin
          - numberOfDaysToShift
          - considerForRouting
          - useAnchorDays
          - useAnchorWeeks
          - anchorDaysRange
          - anchorWeeksRange
          - additionalServiceTime
          - forceBulkServiceTime
          RequiredRelatedIdentity:
          - orderClassIdentity
          CalculatedReadonly:
          - totalDeliveryQuantities
          - totalPickupQuantities
          - isRouted
          - orderType
          MonolithicChildCollection:
          - tasks
          - territories
          - customProperties
    LineItem:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/IdentifierOnlyIdentity'
        skuIdentity:
          $ref: '#/components/schemas/Identity'
        quantities:
          $ref: '#/components/schemas/Quantities'
