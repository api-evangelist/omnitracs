security:
- tokenAuth: []
tags:
- name: Recurring Orders
  description: When saving a recurring order, the specify the order class to determine the service times and/or service windows for the recurring order; otherwise, the default order class is saved with the recurring order. Even if the customer has location service time override or location service window override, the overrides are still linked to an order class.  The only exception is at the recurring order level.  An individual recurring order can have service time overrides and/or service window overrides. When saving a recurring order, a unique order number is required. You can use the service location ID as the order number.  A unique order number allows easy updating of cycle quantities, frequency (service pattern sets), and other data.  The unique order number also allows multiple recurring orders for the same service location in the same planning session.  For instance, service location A can have two tasks, delivery and merchandising.  You can add recurring order A1 for the delivery territory and add recurring order A2 for the merchandising territory.  Each recurring order has its own order class and frequency.
paths:
  /strategicplan/recurringOrders:
    get:
      tags:
      - Recurring Orders
      summary: RecurringOrders
      description: 'NOTE: Orders in modeling sessions are not considered.

        '
      operationId: getRecurringOrders
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: sessionDate
        in: query
        schema:
          type: string
          format: date
        description: The Session Date for which the Route Plan is retrieved.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderExpand'
        description: Comma delimited list of fields to expand.
      - name: routed
        in: query
        schema:
          type: boolean
        description: Include only Routed orders. If true, only routed orders are included. If false, only unrouted orders are included. If not provided, all orders are included.
      responses:
        200:
          $ref: '#/components/responses/GetRecurringOrdersResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Recurring Orders
      summary: RecurringOrders
      operationId: postRecurringOrders
      parameters:
      - name: applyLocationSubstitution
        in: query
        schema:
          type: boolean
        description: Apply Location Substitution for Orders in this request
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: See Integration Guidelines for usage.
                      required:
                      - identity
                      - regionIdentity
                      - sessionIdentity
                      - orderClassIdentity
                      - tasks
                      - territories
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionIdentity:
                          type: object
                          description: 'Identifies the Region in which this data is organized.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        sessionIdentity:
                          type: object
                          properties:
                            entityKey:
                              type: integer
                              description: The routing session's EntityKey. The field is DEPRECATED for PlanningSession requests.
                              example: 101
                            date:
                              type: string
                              description: The date for the routing session must be provided when the EntityKey is omitted. The field is REQUIRED for PlanningSession requests.
                              format: date
                            description:
                              type: string
                              description: The description for the routing session must be provided with the date.
                              example: Daily
                          x-omni-valid:
                            SessionIdentity:
                            - date
                            - description
                            - entityKey
                        previousOriginId:
                          type: string
                        previousTerritoryId:
                          type: string
                        previousDays:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            example: Tuesday
                            enum:
                            - Sunday
                            - Monday
                            - Tuesday
                            - Wednesday
                            - Thursday
                            - Friday
                            - Saturday
                        previousWeek:
                          type: integer
                          description: Use `previousWeeks` instead. The value provided may not be saved correctly because it is capped by the routing session's week count.
                          deprecated: true
                        previousWeeks:
                          type: array
                          description: The weeks in the cycle during which this order was previously routed. Replaces the deprecated `previousWeek` field. Value cannot exceed the number of weeks in the planning session.
                          minItems: 1
                          uniqueItems: true
                          items:
                            type: integer
                            minimum: 1
                        requiredOrigin:
                          type: object
                          description: Required route origin.
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        numberOfDaysToShift:
                          type: integer
                          maximum: 7
                          minimum: 0
                          example: 0
                        considerForRouting:
                          type: boolean
                        useAnchorDays:
                          type: boolean
                        useAnchorWeeks:
                          type: boolean
                        anchorDaysRange:
                          type: integer
                          maximum: 7
                          minimum: 0
                          example: 0
                        anchorWeeksRange:
                          type: integer
                          maximum: 24
                          minimum: 0
                          example: 20
                        additionalServiceTime:
                          type: number
                          description: Time in seconds
                          example: 36000
                        forceBulkServiceTime:
                          type: boolean
                        orderClassIdentity:
                          type: object
                          description: 'Order Class associates the item with a set of Service Time and Service Window parameters.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        servicePatternSetIdentity:
                          type: object
                          description: Service Pattern Set associated with the recurring order
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        currentServicePatternIdentity:
                          type: object
                          description: Service Pattern associated with the recurring order
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        urgency:
                          type: integer
                          description: The importance of the order, which impacts its preference for the routing algorithms
                          maximum: 100
                          minimum: 0
                          example: 75
                        urgencyIncrease:
                          type: integer
                          description: If needed, the amount to increase the order urgency
                          maximum: 100
                          minimum: 0
                          example: 75
                        selector:
                          type: string
                          format: uppercase
                          maxLength: 1
                          minLength: 1
                          pattern: ^[A-Z]{1}$
                          example: S
                        cycleTimeUnitType:
                          type: string
                          example: Day
                          enum:
                          - Day
                          - Week
                          - Month
                        cycleNumberOfTimeUnits:
                          type: integer
                          minimum: 0
                        tasks:
                          type: array
                          description: 'The tasks required to fulfill the Order.


                            Depending on the type of Order, different Tasks will be defined:

                            + Pickup Order (First/Final Mile pickups from the service location back to the depot) - Contains a single task of TaskType Pickup. **Currently unsupported for Recurring Orders**

                            + Delivery Order (First/Final Mile deliveries from the depot to the service location) - Contains a single task of TaskType Delivery

                            + Delivery & Pickup (First/Final Mile simultaneous delivery and pickup at the same service location) - Contains two Tasks, one Delivery and one Pickup.  Both tasks reference the same LocationIdentity. **Currently unsupported for Recurring Orders**

                            + Transfer (Over-the-Road Loads, and special cases within First/Final Mile) - Contains two Tasks, the first a Pickup and the second a Delivery.  Quantities (and Line items if relevant) must be identical between the two tasks. **Requires that the customer is subscribed to Rolling Horizon**

                            '
                          items:
                            type: object
                            description: Represents one step of work that needs to be completed to fulfill the Order.
                            required:
                            - locationIdentity
                            - taskType
                            properties:
                              locationIdentity:
                                type: object
                                description: 'When creating or modifying orders and applyLocationSubstitution=true is provided in the request, the location identifier will be used to determine if a substitution exists for the provided location. This will not occur when only an entityKey is provided in the request.


                                  See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                              quantities:
                                type: array
                                description: If using line item detail, then Quantities are calculated rollups of Line Item Quantities.  Otherwise, they are the set-able Quantities of the Task.
                                maxItems: 3
                                minItems: 3
                                items:
                                  type: number
                              taskType:
                                type: string
                                example: Pickup
                                enum:
                                - Pickup
                                - Delivery
                              lineItems:
                                type: array
                                description: Line items that comprise the Order.  Line items are only relevant if the system is configured to use line items.
                                items:
                                  type: object
                                  required:
                                  - identity
                                  - skuIdentity
                                  properties:
                                    identity:
                                      type: object
                                      description: EntityKey is ignored, Identifier is Required
                                      required:
                                      - identifier
                                      properties:
                                        identifier:
                                          type: string
                                          example: TESTIDENTIFIER
                                      x-omni-valid:
                                        AlwaysRequired:
                                        - identifier
