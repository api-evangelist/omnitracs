                        type: object
                        required:
                        - servicePattern
                        - servicePatternSet
                        properties:
                          servicePattern:
                            type: object
                            properties:
                              entityKey:
                                type: integer
                                description: Represents the entitiy's unique identifier that is assigned by the system.
                                example: 101
                              identifier:
                                type: string
                                description: Represents a value that the entity can be used for identification and labeling purposes.
                                example: TESTIDENTIFIER
                            x-omni-valid:
                              CalculatedReadonly:
                              - description
                          servicePatternSet:
                            type: object
                            properties:
                              entityKey:
                                type: integer
                                description: Represents the entitiy's unique identifier that is assigned by the system.
                                example: 101
                              identifier:
                                type: string
                                description: Represents a value that the entity can be used for identification and labeling purposes.
                                example: TESTIDENTIFIER
                            x-omni-valid:
                              CalculatedReadonly:
                              - description
