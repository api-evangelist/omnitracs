                            type: integer
                            description: Defines the first day of service for a recurring order and is primarily used with "Days Between" service patterns. It acts as the anchor from which the system calculates all subsequent delivery days.
                            example: 12
                          startingWeek:
                            type: integer
                            description: specifies the first week within the overall Cycle Weeks that an order will receive a delivery. It is essential for multi-week service patterns (e.g., "every 2 weeks" or "every 4 weeks"). For instance, if an order is delivered every two weeks and the Starting Week is set to 2, its deliveries will be scheduled for weeks 2, 4, 6, and so on, within the strategic plan.
