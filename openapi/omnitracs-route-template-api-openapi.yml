security:
- tokenAuth: []
tags:
- name: Route Template
  description: Route Template has information for the stops, equipment assigned, workers and its region. Information pertaining to route times can be set and retrieved as well.
paths:
  /dailyplan/routeTemplate:
    get:
      tags:
      - Route Template
      summary: Route template
      description: 'NOTE: Route Templates.

        '
      operationId: getRouteTemplates
      parameters:
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RouteTemplateExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      responses:
        200:
          $ref: '#/components/responses/GetRouteTemplatesResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Route Template
      summary: Route Template
      operationId: postRouteTemplate
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - identity
                      - regionIdentity
                      - equipmentInfo
                      - stops
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionIdentity:
                          type: object
                          description: 'Identifies the Region in which this data is organized.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        description:
                          type: string
                          example: Route Template Description
                        workersInfo:
                          type: array
                          description: Only populated if WorkersInfo EXPAND parameter is set
                          items:
                            type: object
                            required:
                            - identity
                            properties:
                              identity:
                                type: object
                                description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                            x-omni-valid:
                              EmbeddedRelatedIdentity:
                              - identity
                              CalculatedReadonly:
                              - name
                        equipmentInfo:
                          type: array
                          description: Only populated if EquipmentInfo EXPAND parameter is set
                          example:
                          - routeEquipmentInfoType: SpecificEquipment
                            specificEquipmentInfo:
                              identity:
                                entityKey: 101
                                identifier: TESTIDENTIFIER
                          items:
                            type: object
                            required:
                            - routeEquipmentInfoType
                            properties:
                              routeEquipmentInfoType:
                                type: string
                                example: SpecificEquipment
                                enum:
                                - SpecificEquipment
                                - EquipmentType
                              specificEquipmentInfo:
                                type: object
                                description: Required if the entity is of this type
                                required:
                                - identity
                                properties:
                                  identity:
                                    type: object
                                    description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                    properties:
                                      entityKey:
                                        type: integer
                                        description: Represents the entitiy's unique identifier that is assigned by the system.
                                        example: 101
                                      identifier:
                                        type: string
                                        description: Represents a value that the entity can be used for identification and labeling purposes.
                                        example: TESTIDENTIFIER
                                    x-omni-valid:
                                      CalculatedReadonly:
                                      - description
                                x-omni-valid:
                                  EmbeddedRelatedIdentity:
                                  - identity
                                  RequiredRelatedIdentity:
                                  - equipmentTypeIdentity
                                  CalculatedReadonly:
                                  - description
                                  - isPowerUnit
                              equipmentTypeInfo:
                                type: object
                                description: Required if the entity is of this type
                                properties:
                                  identity:
                                    type: object
                                    description: This field only returns an EntityKey in a GET request.
                                    properties:
                                      entityKey:
                                        type: integer
                                        description: Represents the entitiy's unique identifier that is assigned by the system.
                                        example: 101
                                      identifier:
                                        type: string
                                        description: Represents a value that the entity can be used for identification and labeling purposes.
                                        example: TESTIDENTIFIER
                                    x-omni-valid:
                                      CalculatedReadonly:
                                      - description
                                x-omni-valid:
                                  RouteEquipmentTypeInfoIdentity:
                                  - identity
                            x-omni-valid:
                              TypeInfo:
                              - specificEquipmentInfo
                              - equipmentTypeInfo
                              TypeDiscriminator:
                              - routeEquipmentInfoType
                        stops:
                          type: array
                          description: Only populated if Stops EXPAND parameter is set
                          example:
                          - stopTemplateType: originDepotStopTemplate
                            originDepotStopTemplateInfo:
                              locationInfo:
                                identity:
                                  entityKey: 101
                                  identifier: TESTIDENTIFIER
                              loadAction: AsNeeded
                          - stopTemplateType: ServiceableStopTemplate
                            serviceableStopTemplateInfo:
                              locationInfo:
                                identity:
                                  entityKey: 101
                                  identifier: TESTIDENTIFIER
                              customProperties:
                              - value: TESTVALUE
                                key: TESTPROPERTY
                          - stopTemplateType: midrouteDepotStopTemplate
                            midrouteDepotStopTemplateInfo:
                              locationInfo:
                                identity:
                                  entityKey: 101
                                  identifier: TESTIDENTIFIER
                              loadAction: AsNeeded
                              alwaysCreate: false
                              reloadTimeOverride: 3600
                              customProperties:
                              - value: TESTVALUE
                                key: TESTPROPERTY
                          - stopTemplateType: layoverStopTemplate
                            layoverStopTemplateInfo:
                              departureInfo:
                                departureType: FixedDuration
                                fixedDurationInfo:
                                  duration: 3600
                              isPaid: true
                              locationInfo:
                                identity:
                                  entityKey: 101
                                  identifier: TESTIDENTIFIER
                          - stopTemplateType: destinationDepotStopTemplate
                            destinationDepotStopTemplateInfo:
                              locationInfo:
                                identity:
                                  entityKey: 101
                                  identifier: TESTIDENTIFIER
                              customProperties:
                              - value: TESTVALUE
                                key: TESTPROPERTY
                          items:
                            type: object
                            required:
                            - stopTemplateType
                            properties:
                              stopTemplateType:
                                type: string
                                description: Each stop info should be provided with one corresponding stop type.
                                example: OriginDepotStopTemplate
                                enum:
                                - OriginDepotStopTemplate
                                - DestinationDepotStopTemplate
                                - MidrouteDepotStopTemplate
                                - ServiceableStopTemplate
                                - LayoverStopTemplate
                              originDepotStopTemplateInfo:
                                type: object
                                description: 'Only one should be provided.


                                  Required if the entity is of this type'
                                required:
                                - locationInfo
                                properties:
                                  locationInfo:
                                    type: object
                                    required:
                                    - identity
                                    properties:
                                      identity:
                                        type: object
                                        description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                        properties:
                                          entityKey:
                                            type: integer
                                            description: Represents the entitiy's unique identifier that is assigned by the system.
                                            example: 101
                                          identifier:
                                            type: string
                                            description: Represents a value that the entity can be used for identification and labeling purposes.
                                            example: TESTIDENTIFIER
                                        x-omni-valid:
                                          CalculatedReadonly:
                                          - description
                                    x-omni-valid:
                                      EmbeddedRelatedIdentity:
                                      - identity
                                      CalculatedReadonly:
                                      - description
                                      - timeZone
                                  loadAction:
                                    type: string
                                    example: AsNeeded
                                    enum:
                                    - AsNeeded
                                    - Empty
                                    - Full
                                    - None
                                x-omni-valid:
                                  PostPutRequired_PatchOptional:
                                  - locationInfo
                                  PostPutPatchOptional:
                                  - loadAction
                              destinationDepotStopTemplateInfo:
                                type: object
                                description: 'If a DestinationDepotStopTemplate is provided, the route will end at that depot, otherwise, the route will end at the last stop.


                                  Required if the entity is of this type'
                                required:
                                - locationInfo
                                properties:
                                  locationInfo:
                                    type: object
                                    required:
                                    - identity
                                    properties:
                                      identity:
                                        type: object
                                        description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                        properties:
                                          entityKey:
                                            type: integer
                                            description: Represents the entitiy's unique identifier that is assigned by the system.
                                            example: 101
                                          identifier:
                                            type: string
                                            description: Represents a value that the entity can be used for identification and labeling purposes.
                                            example: TESTIDENTIFIER
                                        x-omni-valid:
                                          CalculatedReadonly:
                                          - description
                                    x-omni-valid:
                                      EmbeddedRelatedIdentity:
                                      - identity
                                      CalculatedReadonly:
                                      - description
                                      - timeZone
                                  customProperties:
                                    type: array
                                    description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
                                    items:
                                      type: object
                                      properties:
                                        value:
                                          type: string
                                          example: Custom Value
                                        key:
                                          type: string
                                          example: Custom Key
                                      x-omni-valid:
                                        PostPutPatchOptional:
                                        - value
                                        - key
                                x-omni-valid:
                                  PostPutRequired_PatchOptional:
                                  - locationInfo
                                  CalculatedReadonly:
                                  - distanceTo
                                  MonolithicChildCollection:
                                  - customProperties
                              midrouteDepotStopTemplateInfo:
                                type: object
                                description: 'A stop at a depot on a route that is commonly used for reloading.


                                  Required if the entity is of this type'
                                required:
                                - locationInfo
                                - loadAction
                                - alwaysCreate
                                properties:
                                  locationInfo:
                                    type: object
                                    required:
                                    - identity
