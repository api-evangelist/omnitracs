        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    StopTemplate:
      type: object
      properties:
        stopTemplateType:
          description: Each stop info should be provided with one corresponding stop type.
          allOf:
          - $ref: '#/components/schemas/StopTemplateType'
        originDepotStopTemplateInfo:
          description: Only one should be provided.
          allOf:
          - $ref: '#/components/schemas/OriginDepotStopTemplate'
        destinationDepotStopTemplateInfo:
          description: If a DestinationDepotStopTemplate is provided, the route will end at that depot, otherwise, the route will end at the last stop.
          allOf:
          - $ref: '#/components/schemas/DestinationDepotStopTemplate'
        midrouteDepotStopTemplateInfo:
          description: A stop at a depot on a route that is commonly used for reloading.
          allOf:
          - $ref: '#/components/schemas/MidrouteDepotStopTemplate'
        serviceableStopTemplateInfo:
          description: A service point in the Route.
          allOf:
          - $ref: '#/components/schemas/ServiceableStopTemplate'
        layoverStopTemplateInfo:
          description: A non-serviceable stop. If a location is not provided then the previous stop's location will be used.
          allOf:
          - $ref: '#/components/schemas/LayoverStopTemplate'
      x-omni-valid:
        TypeInfo:
        - originDepotStopTemplateInfo
        - destinationDepotStopTemplateInfo
        - midrouteDepotStopTemplateInfo
        - serviceableStopTemplateInfo
        - layoverStopTemplateInfo
        TypeDiscriminator:
        - stopTemplateType
    RouteTemplatesContainer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteTemplate'
      x-omni-valid:
        AlwaysRequired:
        - items
    OriginDepotStopLocationInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        description:
          type: string
