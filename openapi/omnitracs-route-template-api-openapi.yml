          items:
            $ref: '#/components/schemas/CustomProperty'
      x-omni-valid:
        PostPutRequired_PatchOptional:
        - locationInfo
        - loadAction
        - alwaysCreate
        PostPutPatchOptional:
        - reloadTimeOverride
        CalculatedReadonly:
        - distanceTo
        MonolithicChildCollection:
        - customProperties
    FixedDeparture:
