      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/OrderContainer'
    GetEntityResponse:
      type: object
    HazmatTypeFlags:
      type: string
      example: Class2
      enum:
      - None
      - Class1
      - Class2
      - Class3
      - Class4
      - Class5
      - Class6
      - Class7
      - Class8
      - Class9
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    OrderExpand:
      type: string
      example: All
      enum:
      - Tasks
      - CategoryQuantities
      - All
    SingleRegionEntity:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - type: object
        properties:
          regionIdentity:
            description: Identifies the Region in which this data is organized.
            allOf:
            - $ref: '#/components/schemas/Identity'
        x-omni-valid:
          RequiredRelatedIdentity:
          - regionIdentity
    ModifyEntityResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
    ModifyEntityByEntityKeyJobStatusResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/Result'
        jobStatus:
          $ref: '#/components/schemas/JobStatus'
    Timestamp:
      type: string
      format: date-time
    ServiceOverrides:
      type: object
      description: Open/Close and Service Window Overrides
      properties:
        openCloseOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TimeWindowDetail'
        serviceWindowOverrides:
          type: array
          items:
            $ref: '#/components/schemas/TimeWindowDetail'
      x-omni-valid:
        MonolithicChildCollection:
        - openCloseOverrides
        - serviceWindowOverrides
        PostPutOptional:
        - openCloseOverrides
        - serviceWindowOverrides
    GetOrdersResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/OrdersContainer'
    OrderContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/Order'
      x-omni-valid:
        AlwaysRequired:
        - item
    SessionBasedObject:
      description: See Integration Guidelines for usage.
      allOf:
      - $ref: '#/components/schemas/SingleRegionEntity'
      - type: object
        properties:
          sessionIdentity:
            $ref: '#/components/schemas/Session'
        x-omni-valid:
          AlwaysRequired:
          - sessionIdentity
    DayOfWeek:
      type: string
      example: Tuesday
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    ErrorContainer:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    TimeOfDay:
      type: string
      description: Time of day in HH:MM:SS format.
      example: 36000
    HazmatType:
      type: object
      properties:
        class:
          $ref: '#/components/schemas/HazmatTypeFlags'
        description:
          type: string
          example: class 2 type
      x-omni-valid:
        AlwaysRequired:
        - class
        CalculatedReadonly:
        - description
    Duration:
      type: number
      description: Time in seconds
      example: 36000
    WorkerTask:
      type: object
      description: Represents one step of work that needs to be completed to fulfill the Order.
      properties:
        locationIdentity:
          description: When creating or modifying orders and applyLocationSubstitution=true is provided in the request, the location identifier will be used to determine if a substitution exists for the provided location. This will not occur when only an entityKey is provided in the request.
          allOf:
          - $ref: '#/components/schemas/Identity'
        quantities:
          description: If using line item detail, then Quantities are calculated rollups of Line Item Quantities.  Otherwise, they are the set-able Quantities of the Task.
          allOf:
          - $ref: '#/components/schemas/Quantities'
        taskType:
          type: string
          example: Pickup
          enum:
          - Pickup
          - Delivery
        lineItems:
          type: array
          description: Line items that comprise the Order.  Line items are only relevant if the system is configured to use line items.
          items:
            $ref: '#/components/schemas/LineItem'
        priorityOverride:
          type: integer
          description: Overrides a location priority
          maximum: 10
          minimum: 0
          example: 6
        overrides:
          description: Open/Close and Service Window Overrides - note entire override should be supplied on PATCH or PUT, Open/Close and Service Windows can not be separately updated.
          allOf:
          - $ref: '#/components/schemas/ServiceOverrides'
        assignedRouteIdentity:
          description: Identity of the Route that the Order is assigned to
          allOf:
          - $ref: '#/components/schemas/Identity'
      x-omni-valid:
        RequiredRelatedIdentity:
        - locationIdentity
        ReadonlyRelatedIdentity:
        - assignedRouteIdentity
        AlwaysRequired:
        - taskType
        TaskQuantitiesLineItems:
        - lineItems
        - quantities
        PostPutPatchOptional:
        - priorityOverride
        PostPutOptional:
        - overrides
        MonolithicChildCollection:
        - overrides
    Quantities:
      type: array
      maxItems: 3
      minItems: 3
      items:
        type: number
    LineItem:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/IdentifierOnlyIdentity'
        skuIdentity:
          $ref: '#/components/schemas/Identity'
        quantities:
          $ref: '#/components/schemas/Quantities'
        hazmatTypes:
          type: array
          description: Array of Hazmat Types
          items:
            $ref: '#/components/schemas/HazmatType'
        workflowExtensions:
          type: array
          description: Workflow Extensions for the Line Item. These are displayed in the Drive app for the driver as level 4 custom properties.
          items:
            $ref: '#/components/schemas/WorkflowExtension'
        customProperties:
          type: array
          description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
          items:
            $ref: '#/components/schemas/CustomProperty'
      x-omni-valid:
        PrimaryIdentity:
        - identity
        RequiredRelatedIdentity:
        - skuIdentity
        PostPutOptional:
        - workflowExtensions
        PostPutPatchOptional:
        - quantities
        MonolithicChildCollection:
        - workflowExtensions
        - customProperties
        CalculatedReadonly:
        - hazmatTypes
    CustomProperty:
      type: object
      properties:
        value:
          type: string
          example: Custom Value
        key:
          type: string
          example: Custom Key
      x-omni-valid:
        PostPutPatchOptional:
        - value
        - key
    TimeWindowDetail:
      type: object
      properties:
        daysOfWeek:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DayOfWeek'
        startTimeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        endTimeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
      x-omni-valid:
        PostPutPatchRequired:
        - daysOfWeek
        - startTimeOfDay
        - endTimeOfDay
    Session:
      type: object
      properties:
        entityKey:
          type: integer
          description: The routing session's EntityKey. The field is DEPRECATED for PlanningSession requests.
          example: 101
        date:
          type: string
          description: The date for the routing session must be provided when the EntityKey is omitted. The field is REQUIRED for PlanningSession requests.
          format: date
        description:
          type: string
          description: The description for the routing session must be provided with the date.
          example: Daily
      x-omni-valid:
        SessionIdentity:
        - date
        - description
        - entityKey
    Result:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        error:
          $ref: '#/components/schemas/Error'
    WorkflowExtension:
      type: object
      description: Workflow Extensions for Routes, Stops, Orders, and Line Items. These are displayed in the Drive app for the driver as custom properties.
      properties:
        label:
          type: string
          description: Label for the custom property.
          example: TESTLABEL
        value:
          type: string
          description: Value for the custom property.
          example: TESTVALUE
        permissions:
          type: string
          example: ReadWrite
          enum:
          - ReadOnly
          - ReadWrite
        sort:
          type: integer
          description: If specified, will be used for sorting; otherwise, the properties will be sorted by the label.
          example: 2
        type:
          type: string
          example: Input
          enum:
          - Url
          - Input
          - File
          - Json
        hidden:
          type: boolean
          description: If true, the custom property will NOT be displayed to the driver.
          example: true
        showInPlanner:
          type: boolean
          description: Supported for only Route and Stop level Workflow Entensions. If set to true, the custom property will be shown on the Drive trip planner screen as additional information in the trip and stop headers.
          example: false
      x-omni-valid:
        PostPutOptional:
        - label
        - value
        - permissions
        - sort
        - type
        - hidden
        - showInPlanner
    ModifyEntityJobStatusResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        jobStatus:
          $ref: '#/components/schemas/JobStatus'
    Order:
      allOf:
      - $ref: '#/components/schemas/SessionBasedObject'
      - type: object
        properties:
          beginDate:
            type: string
            description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
            format: date
          endDate:
            type: string
            description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
            format: date
          specialInstructions:
            type: string
            example: These are the special instructions
          selector:
            type: string
            description: Single Character in uppercase, not any kind of whitespace or invisible separator
            format: uppercase
            maxLength: 1
            minLength: 1
            pattern: ^[A-Z]{1}$
            example: S
          orderClassIdentity:
            description: Order Class associates the item with a set of Service Time and Service Window parameters.
            allOf:
            - $ref: '#/components/schemas/Identity'
          requiredRouteOriginDepotIdentity:
            description: Depot from which the route containing this order must originate.
            allOf:
            - $ref: '#/components/schemas/Identity'
          urgency:
            type: integer
            description: The importance of the order, which impacts its preference for the routing algorithms. The maximum value for this property is determined by the Maximum Order Urgency Region setting.
            maximum: 99999
            minimum: 0
          urgencyIncrease:
            type: integer
            description: If needed, the amount to increase the order urgency.
            maximum: 100
            minimum: 0
            example: 2
          totalDeliveryQuantities:
            description: Calculated rollups
            allOf:
            - $ref: '#/components/schemas/Quantities'
          totalPickupQuantities:
            description: Calculated rollups
            allOf:
            - $ref: '#/components/schemas/Quantities'
          plannedDeliveryCategoryQuantities:
            description: Delivery Category Quantities
            allOf:
            - $ref: '#/components/schemas/CategoryQuantities'
          plannedPickupCategoryQuantities:
            description: Pickup Category Quantities
            allOf:
            - $ref: '#/components/schemas/CategoryQuantities'
          isRouted:
            type: boolean
            description: Indicates whether this order is assigned to a Route
            example: true
          hazmatTypes:
            type: array
            description: Array of Hazmat Type, types can only be specified once per array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/HazmatType'
          workflowExtensions:
            type: array
            description: Workflow Extensions for the Order. These are displayed in the Drive app for the driver as level 3 custom properties.
            items:
              $ref: '#/components/schemas/WorkflowExtension'
          tasks:
            type: array
            description: 'The tasks required to fulfill the Order.


              Depending on the type of Order, different Tasks will be defined:

              + Pickup Order (First/Final Mile pickups from the service location back to the depot) - Contains a single task of TaskType Pickup.

              + Delivery Order (First/Final Mile deliveries from the depot to the service location) - Contains a single task of TaskType Delivery

              + Delivery & Pickup (First/Final Mile simultaneous delivery and pickup at the same service location) - Contains two Tasks, one Delivery and one Pickup.  Both tasks reference the same LocationIdentity.

              + Transfer (Over-the-Road Loads, and special cases within First/Final Mile) - Contains two Tasks, the first a Pickup and the second a Delivery.  Quantities (and Line items if relevant) must be identical between the two tasks.

              '
            items:
              $ref: '#/components/schemas/WorkerTask'
          customProperties:
            type: array
            description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
            items:
              $ref: '#/components/schemas/CustomProperty'
          forceBulkServiceTime:
            type: boolean
            description: 'Indicates whether the order is being forced to use bulk service times, even if the quantity does not meet the bulk threshold.

              If any order on the stop has Force Bulk selected, it will be selected for all orders on the stop.

              '
            example: false
          preferredRouteIdentifier:
            type: string
            description: 'The unique ID of the route that the order should be placed on. If a preferred route ID is specified, the order will be placed on that route,

              unless you manually place the order on a different route or specify that this requirement can be ignored.

              '
            example: ROUTE2
          netRevenue:
            type: number
            example: 20
          additionalServiceTime:
            $ref: '#/components/schemas/Duration'
          assignedStopPlannedSequenceNumber:
            type: number
            description: The sequence of the stop that the order is assigned to on the currently assigned route at the time of planning.
            example: 3
          assignedStopActualSequenceNumber:
            type: number
            description: The final sequence of the stop that the order is assigned to on the currently assigned route.
            example: 4
          assignedDate:
            type: string
            description: The date this order is considered assigned; when `beginDate` is provided and `endDate` is null, this value equals `beginDate`, and when both `beginDate` and `endDate` are provided, this value equals the routed date (null/blank if the order is not routed).
            format: date
        x-omni-valid:
          PostPutRequired:
          - tasks
          PostPutOptional:
          - workflowExtensions
          PostPutPatchOptional:
          - beginDate
          - endDate
          - specialInstructions
          - selector
          - urgency
          - urgencyIncrease
          - hazmatTypes
          - plannedDeliveryCategoryQuantities
          - plannedPickupCategoryQuantities
          - forceBulkServiceTime
          - preferredRouteIdentifier
          - netRevenue
          - additionalServiceTime
          RequiredRelatedIdentity:
          - orderClassIdentity
          OptionalRelatedIdentity:
          - requiredRouteOriginDepotIdentity
          CalculatedReadonly:
          - totalDeliveryQuantities
          - totalPickupQuantities
          - isRouted
          - assignedStopPlannedSequenceNumber
          - assignedStopActualSequenceNumber
          - assignedDate
          MonolithicChildCollection:
          - tasks
          - workflowExtensions
          - customProperties
