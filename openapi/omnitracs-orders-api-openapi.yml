security:
- tokenAuth: []
tags:
- name: Orders
  description: "When saving an Order, it is crucial to specify the Order Class. The Order Class determines the Service Times and service Windows for that Order, unless there are overrides at the Service Location or directly on the Order itself.  \n\nAt a minimum, you must define one Order Class. However, to facilitate adjustments in Service Times, Service Windows, and Equipment Types for different types of Orders during routing, it is advisable to create multiple Order Classes. These classes enable you to categorize several aspects that influence an Order's delivery, such as the Service Time, Service Window or Equipment Type.\n\nFor example, you can create distinct Order Classes for various tasks:\n\n- **Delivery (DEL)**: An Order Class for delivery with a specific set of service times and windows. \n\n- **Merchandising (MER)**: A separate order class for merchandisers, featuring different service times and windows.\n\nBy assigning the appropriate order class when adding orders, the corresponding service times and windows are automatically applied, ensuring that each order is handled correctly.\n\n**NOTE:** If the request to save Orders contains at least 5 items, then the Orders will be processed by a job. If the job completes within 30 seconds, the response will include the results, detailing the Orders that were successfully saved and any errors occurred. If the job does not finish within 30 seconds, the response will instead provide a job key.\n\nThe user is then required to query the API at `dailyplan/orders/jobstatus` with the job key and continue querying until a successful status and the results are returned.\n\n**NOTE:** Concurrent requests are allowed, but issues can arise if the requests contain Orders that access the same object such as Routes or Unassigned Order Groups. In this case, it is recommended to place multiple Orders into a single request to avoid these issues.\n\n"
paths:
  /dailyplan/orders:
    get:
      tags:
      - Orders
      summary: Orders
      description: 'NOTE: Orders in modeling sessions are not considered.

        '
      operationId: getOrders
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: sessionDate
        in: query
        schema:
          type: string
          format: date
        description: The Session Date for which the Route Plan is retrieved.
      - name: sessionEntityKey
        in: query
        schema:
          type: integer
        description: Filters results to Orders that belong to the specified Session entity key.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderExpand'
        description: Comma delimited list of fields to expand.
      - name: routed
        in: query
        schema:
          type: boolean
        description: Include only Routed orders. If true, only routed orders are included. If false, only unrouted orders are included. If not provided, all orders are included.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      - name: requiredRouteOriginDepotIdentifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: An optional comma delimited list of requiredRouteOriginDepotIdentity identifiers that, if specified, will act as an order filter and only orders with matching requiredRouteOriginDepotIdentity identifiers will be returned. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
        examples:
          min:
            summary: Single identifier
            value: identifier1
          max:
            summary: Multiple identifiers
            value: identifier1,identifier2,identifier3,identifier4
      - name: excludeResultsFromDeletedRegions
        in: query
        schema:
          type: boolean
          default: false
        description: Set to true to exclude results that belong to Regions that have been deleted.
      responses:
        200:
          $ref: '#/components/responses/GetOrdersResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Orders
      summary: Orders
      description: 'NOTE: If the request contains at least 5 items, then the Orders will be saved by a job. If the job is executed within 30 seconds, then the response will contain the result with the successfully saved orders and the possible errors. If the job is not finished in 30 seconds, then the response will contain the job key. The user will have to call the api dailyplan/orders/jobstatus/ with the job key and keep calling this api until they get a successful status and the result.

        '
      operationId: postOrders
      parameters:
      - name: applyLocationSubstitution
        in: query
        schema:
          type: boolean
        description: Apply Location Substitution for Orders in this request
      - name: combineOrdersType
        in: query
        schema:
          type: string
          enum:
          - None
          - Active
          - Built
          - AllPlanned
        description: Combine the orders to an Active or Built Route. This applies only to planned and not dispatched routes.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: See Integration Guidelines for usage.
                      required:
                      - identity
                      - regionIdentity
                      - sessionIdentity
                      - orderClassIdentity
                      - tasks
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionIdentity:
                          type: object
                          description: 'Identifies the Region in which this data is organized.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        sessionIdentity:
                          type: object
                          properties:
                            entityKey:
                              type: integer
                              description: The routing session's EntityKey. The field is DEPRECATED for PlanningSession requests.
                              example: 101
                            date:
                              type: string
                              description: The date for the routing session must be provided when the EntityKey is omitted. The field is REQUIRED for PlanningSession requests.
                              format: date
                            description:
                              type: string
                              description: The description for the routing session must be provided with the date.
                              example: Daily
                          x-omni-valid:
                            SessionIdentity:
                            - date
                            - description
                            - entityKey
                        beginDate:
                          type: string
                          description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
                          format: date
                        endDate:
                          type: string
                          description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
                          format: date
                        specialInstructions:
                          type: string
                          example: These are the special instructions
                        selector:
                          type: string
                          description: Single Character in uppercase, not any kind of whitespace or invisible separator
                          format: uppercase
                          maxLength: 1
                          minLength: 1
                          pattern: ^[A-Z]{1}$
                          example: S
                        orderClassIdentity:
                          type: object
                          description: 'Order Class associates the item with a set of Service Time and Service Window parameters.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        requiredRouteOriginDepotIdentity:
                          type: object
                          description: 'Depot from which the route containing this order must originate.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        urgency:
                          type: integer
                          description: The importance of the order, which impacts its preference for the routing algorithms. The maximum value for this property is determined by the Maximum Order Urgency Region setting.
                          maximum: 99999
                          minimum: 0
                        urgencyIncrease:
                          type: integer
                          description: If needed, the amount to increase the order urgency.
                          maximum: 100
                          minimum: 0
                          example: 2
                        plannedDeliveryCategoryQuantities:
                          type: object
                          description: Delivery Category Quantities
                          properties:
                            category1Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                            category2Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                            category3Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                          x-omni-valid:
                            MonolithicChildCollection:
                            - category1Quantities
                            - category2Quantities
                            - category3Quantities
                            PostPutOptional:
                            - category1Quantities
                            - category2Quantities
                            - category3Quantities
                        plannedPickupCategoryQuantities:
                          type: object
                          description: Pickup Category Quantities
                          properties:
                            category1Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                            category2Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                            category3Quantities:
                              type: array
                              maxItems: 3
                              minItems: 3
                              items:
                                type: number
                          x-omni-valid:
                            MonolithicChildCollection:
                            - category1Quantities
                            - category2Quantities
                            - category3Quantities
                            PostPutOptional:
                            - category1Quantities
                            - category2Quantities
                            - category3Quantities
                        hazmatTypes:
                          type: array
                          description: Array of Hazmat Type, types can only be specified once per array
                          uniqueItems: true
                          items:
                            type: object
                            required:
                            - class
                            properties:
                              class:
                                type: string
                                example: Class2
                                enum:
                                - None
                                - Class1
                                - Class2
                                - Class3
                                - Class4
                                - Class5
                                - Class6
                                - Class7
                                - Class8
                                - Class9
                            x-omni-valid:
                              AlwaysRequired:
                              - class
                              CalculatedReadonly:
                              - description
                        workflowExtensions:
                          type: array
                          description: Workflow Extensions for the Order. These are displayed in the Drive app for the driver as level 3 custom properties.
                          items:
                            type: object
                            description: Workflow Extensions for Routes, Stops, Orders, and Line Items. These are displayed in the Drive app for the driver as custom properties.
                            properties:
                              label:
                                type: string
