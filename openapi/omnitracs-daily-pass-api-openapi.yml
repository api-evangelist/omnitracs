security:
- tokenAuth: []
tags:
- name: Daily Pass
  description: A Daily Pass contains all of the rules for routing a defined set of orders.
paths:
  /dailyplan/dailyPass:
    get:
      tags:
      - Daily Pass
      summary: Daily Pass
      description: 'NOTE: Retrieve daily routing passes.

        '
      operationId: getDailyPass
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: sessionEntityKey
        in: query
        schema:
          type: string
        description: Entity key of a Routing Session.
      - name: sessionDate
        in: query
        schema:
          type: string
          format: date
        description: Date of a Routing Session.
      - name: sessionDescription
        in: query
        schema:
          type: string
        description: Description of a Routing Session.
      responses:
        200:
          $ref: '#/components/responses/GetDailyPassResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /dailyplan/dailyPass/{entityKey}:
    get:
      tags:
      - Daily Pass
      summary: DailyPass By Entity Key
      description: 'NOTE: Retrieve Daily Routing Pass by entity key.

        '
      operationId: getDailyPassByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      responses:
        200:
          $ref: '#/components/responses/GetDailyPassByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
    Entity:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        createdBy:
          type: string
          example: tester@test.com
        createdTimestamp:
          $ref: '#/components/schemas/Timestamp'
        modifiedBy:
          type: string
          example: tester@test.com
        modifiedTimestamp:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          description: Version number of the entity.  In PUT/PATCH operations, if this field is included then the number will be compared with the current version of the entity, and an error returned if they do not match.
          example: 1
      x-omni-valid:
        PrimaryIdentity:
        - identity
        SystemGeneratedReadonly:
        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    DepotEquipmentTypeQuantity:
      type: object
      properties:
        depotEntityKey:
          type: integer
          description: The entity key of the depot to which this equipment quantity applies
        equipmentTypeEntityKey:
          type: integer
          description: The entity key of the equipment type available at the specified depot
        quantity:
          type: integer
          description: The number of units of the specified equipment type at the depot
      x-omni-valid:
        PostPutPatchOptional:
        - depotEntityKey
        - equipmentTypeEntityKey
        - quantity
    DailyAttributes:
      type: object
      properties:
        onlyCreateRoutesFromTemplates:
          type: boolean
          description: If `true`, routes will only be created from the selected route template set
        goals:
          allOf:
          - $ref: '#/components/schemas/Goals'
        routeTemplateSetEntityKeys:
          type: array
          description: The entity keys of the route template sets to be used when creating routes
          items:
            type: integer
        enforceRouteTemplates:
          type: boolean
          description: If Routing will obey the route template rules
        autoGenerateOrders:
          type: boolean
          description: If `true`, orders will be automatically created for stops that do not have orders assigned to them when the route is created.
        updateActivePasses:
          type: boolean
          description: If `true`, active passes will be updated with the newly created routes
        weeklyRoutingBalanceDays:
          type: boolean
          description: If Routing should consider balancing days for weekly routing goals
        visualRouteClustering:
          type: boolean
          description: If `true`, routes will be visually clustered on the map based on their geographic proximity
      x-omni-valid:
        PostPutPatchOptional:
        - onlyCreateRoutesFromTemplates
        - goals
        - routeTemplateSetEntityKeys
        - enforceRouteTemplates
        - autoGenerateOrders
        - updateActivePasses
        - weeklyRoutingBalanceDays
        - visualRouteClustering
    DailyPass:
      allOf:
      - $ref: '#/components/schemas/SessionBasedObject'
      - type: object
        properties:
          commonAttributes:
            description: Common attributes for the Daily Pass.
            allOf:
            - $ref: '#/components/schemas/CommonAttributes'
          passTemplateIdentity:
            description: Identity of the Pass Template associated with this Daily Pass.
            allOf:
            - $ref: '#/components/schemas/Identity'
          dailyAttributes:
            description: Daily-specific attributes for the Daily Pass.
            allOf:
            - $ref: '#/components/schemas/DailyAttributes'
        x-omni-valid:
          PostPutPatchOptional:
          - commonAttributes
          - passTemplateIdentity
          - dailyAttributes
    GetEntityResponse:
      type: object
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    SingleRegionEntity:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - type: object
        properties:
          regionIdentity:
            description: Identifies the Region in which this data is organized.
            allOf:
            - $ref: '#/components/schemas/Identity'
        x-omni-valid:
          RequiredRelatedIdentity:
          - regionIdentity
    DailyPassContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/DailyPass'
      x-omni-valid:
        AlwaysRequired:
        - item
    Timestamp:
      type: string
      format: date-time
    DailyPassesContainer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyPass'
      x-omni-valid:
        AlwaysRequired:
        - items
    SessionBasedObject:
      description: See Integration Guidelines for usage.
      allOf:
      - $ref: '#/components/schemas/SingleRegionEntity'
      - type: object
        properties:
          sessionIdentity:
            $ref: '#/components/schemas/Session'
        x-omni-valid:
          AlwaysRequired:
          - sessionIdentity
    Goals:
      type: object
      properties:
        basicGoalsMissedTimeWindowFactor:
          type: number
          description: Weighting factor for missed time windows when using basic goals
          example: 0.6
        basicGoalsRunTimeBalanceFactor:
          type: number
          description: Weighting factor for run time balance when using basic goals
          example: 0.6
        useAdvancedGoals:
          type: boolean
          description: If advanced goals are used instead of basic goals
        missedTimeWindowEarlyFactor:
          type: number
          description: Weighting factor for early missed time windows when using advanced goals
          example: 0.4
        missedTimeWindowLateFactor:
          type: number
          description: Weighting factor for late missed time windows when using advanced goals
          example: 0.4
        runTimeBalanceFactor:
          type: number
          description: Weighting factor for run time balance when using advanced goals
          example: 0.4
        quantityBalanceFactor:
          type: number
          description: Weighting factor for quantity balance when using advanced goals
          example: 0.4
        routeClusteringFactor:
          type: number
          description: Weighting factor for route clustering when using advanced goals
          example: 0.4
        preferredRunTimeFactor:
          type: number
          description: Weighting factor for preferred run time when using advanced goals
          example: 0.4
        cellBoundariesFactor:
          type: number
          description: Weighting factor for cell boundaries when using advanced goals
          example: 0.4
        routeTemplateFactor:
          type: number
          description: Weighting factor for route templates when using advanced goals
          example: 0.4
      x-omni-valid:
        PostPutPatchRequired: []
        PostPutPatchOptional:
        - basicGoalsMissedTimeWindowFactor
        - basicGoalsRunTimeBalanceFactor
        - useAdvancedGoals
        - missedTimeWindowEarlyFactor
        - missedTimeWindowLateFactor
        - runTimeBalanceFactor
        - quantityBalanceFactor
        - routeClusteringFactor
        - preferredRunTimeFactor
        - cellBoundariesFactor
        - routeTemplateFactor
        CalculatedReadonly: []
    BreakTemplate:
      type: object
      properties:
        targetSpan:
          description: Target time between breaks in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        consideredTimeType:
          type: string
          description: Time type to be considered when determining when breaks will occur
          example: DrivingTime
          enum:
          - RealTime
          - DrivingTime
        spanStart:
          type: string
          description: Starting point for measuring the target span
          example: BeginningOfRoute
          enum:
          - BeginningOfRoute
          - LastBreak
        placement:
          type: string
          description: Placement of the break relative to the target span
          example: AfterClosestStopToThreshold
          enum:
          - AfterClosestStopToThreshold
          - AfterStopBeforeThreshold
        breakLength:
          description: Length of break in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        paid:
          type: boolean
          description: If the break will be paid or not
        isRecurring:
          type: boolean
          description: If the break will reoccur multiple times on a route
      x-omni-valid:
        PostPutPatchOptional:
        - targetSpan
        - consideredTimeType
        - spanStart
        - placement
        - breakLength
        - paid
        - isRecurring
    ErrorContainer:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    CommonAttributes:
      type: object
      description: Common pass attributes
      properties:
        startTime:
          description: The time the route should begin
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
        maximumRunTime:
          description: The maximum length of time the route can take in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        maximumTravelTime:
          description: The maximum amount of time the worker should be driving on the route
          allOf:
          - $ref: '#/components/schemas/Duration'
        preferredRunTime:
          description: The preferred length of time for the route to take in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        preRouteTime:
          description: The length of time the pre-route stop should be in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        postRouteTime:
          description: The length of time the post-route stop should be in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        assignHelper:
          type: boolean
          description: If the routes have a helper
        lastStopIsDestination:
          type: boolean
          description: Routes will end at the last stop, instead of returning to the depot
        useEquipmentTypeUsageOrdering:
          type: boolean
          description: Indicates whether or not Routing should use the equipment types in the order listed
        resourceMode:
          type: string
          description: The resource availability mode
          example: Simple
          enum:
          - Simple
          - Advanced
        routeIdentifierSeed:
          type: string
          description: The starting point that will be used for the route identifier
          example: TEST_ROUTE
        considerSize1:
          type: boolean
          description: If "size1" is considered in measuring the fullness of the equipment assigned to the route
        considerSize2:
          type: boolean
          description: If "size2" is considered in measuring the fullness of the equipment assigned to the route
        considerSize3:
          type: boolean
          description: If "size3" is considered in measuring the fullness of the equipment assigned to the route
        depotEquipmentTypeQuantities:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/DepotEquipmentTypeQuantity'
        breakTemplates:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BreakTemplate'
        minimumPercentOfPreferredTime:
          type: integer
          description: Minimum percent of preferred time of the route
        routeMinimumPercentOfCapacity:
          type: integer
          description: Minimum percent of capacity of the route
        allConsideredSizesMustMeetMinRouteCapacity:
          type: boolean
          description: If the route must meet all defined Equipment Capacity Restrictions.
        mustMeetAllRouteMinimums:
          type: boolean
          description: If the route must meet all route minimums
        maxServiceStops:
          type: integer
          description: The maximum number of stops that can be placed on a single route
        reloadOptions:
          allOf:
          - $ref: '#/components/schemas/ReloadOptions'
        multiDayRoutingOptions:
          allOf:
          - $ref: '#/components/schemas/MultiDayRoutingOptions'
        includeServiceTimeInTimeWindowCalculations:
          type: boolean
          description: Consider the service time when calculating time windows
        pickupsAtEnd:
          type: boolean
          description: Orders specified as pickups will be placed at the end of the route
        adjustStartTime:
          type: boolean
          description: Indicates whether or not the route start time can be adjusted to allow more service windows to be met
        adjustStartEarly:
          description: The maximum amount of time the route's start time can be adjusted earlier to make more service locations service windows in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        adjustStartLate:
          description: The maximum amount of time the route's start time can be adjusted later to make more service locations service windows in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        waitToMakeTimeWindows:
          type: boolean
          description: Indicates whether or not a worker can arrive at stops early and wait to meet the stop's service window
        maxWaitTimePerStop:
          description: The maximum amount of time the worker can wait at the stop for it to open or to meet the service windows in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        mustMakeAllTimeWindows:
          type: boolean
          description: Indicates whether or not all stops are forced to occur within service windows when the route is created
        recalculateBreaksAfterRouteCreation:
          type: boolean
          description: Indicates whether or not Omnitracs is to re-evaluate and re-insert breaks due to route changes
        enforceRigidCellBoundaries:
          type: boolean
          description: If `true`, all of the stops on a route must be inside or outside of the cell
        onlyRouteOrdersInCells:
          type: boolean
          description: If `true`, only orders that are contained in cells will be routed
        cellSetEntityKey:
          type: integer
          description: Entity Key of the Cell Set to be used when routing
        maxWaitTimeForTimeOfDayRestriction:
          description: Maximum wait time allowed for time-of-day restrictions in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        startingLoadAction:
          type: string
          example: AsNeeded
          enum:
          - AsNeeded
          - Full
          - Empty
          - None
        shouldUseAllResources:
          type: boolean
        enableCompartmentRouting:
          type: boolean
          description: If Routing will consider the capacity and allowed product types of each compartment when creating the routes
        omitStem:
          type: boolean
          description: If `true`, the route's travel time and distance will start from the first stop and not the origin
      x-omni-valid:
        PostPutPatchOptional:
        - startTime
        - maximumRunTime
        - maximumTravelTime
        - preferredRunTime
        - preRouteTime
        - postRouteTime
        - assignHelper
        - lastStopIsDestination
        - useEquipmentTypeUsageOrdering
        - resourceMode
        - routeIdentifierSeed
        - considerSize1
        - considerSize2
        - considerSize3
        - depotEquipmentTypeQuantities
        - breakTemplates
        - minimumPercentOfPreferredTime
        - routeMinimumPercentOfCapacity
        - allConsideredSizesMustMeetMinRouteCapacity
        - mustMeetAllRouteMinimums
        - maxServiceStops
        - reloadOptions
        - multiDayRoutingOptions
        - includeServiceTimeInTimeWindowCalculations
        - pickupsAtEnd
        - adjustStartTime
        - adjustStartEarly
        - adjustStartLate
        - waitToMakeTimeWindows
        - maxWaitTimePerStop
        - mustMakeAllTimeWindows
        - recalculateBreaksAfterRouteCreation
        - enforceRigidCellBoundaries
        - onlyRouteOrdersInCells
        - cellSetEntityKey
        - maxWaitTimeForTimeOfDayRestriction
        - startingLoadAction
        - shouldUseAllResources
        - enableCompartmentRouting
        - omitStem
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    TimeOfDay:
      type: string
      description: Time of day in HH:MM:SS format.
      example: 36000
    Duration:
      type: number
      description: Time in seconds
      example: 36000
    ReloadOptions:
      type: object
      properties:
        enableCapacityReloads:
          type: boolean
          description: If Routing is allowed to reload a truck for another trip based on the truck's capacity
        enableRunTimeReloads:
          type: boolean
          description: If Routing is allowed to reload a truck for another trip based on the route's total run time
        tripMaximumPaidTime:
          description: Maximum paid time for the trip
          allOf:
          - $ref: '#/components/schemas/Duration'
        capacityReloadThresholdPercent:
          type: integer
          description: How full the truck must be to be eligible to be reloaded
        maxRouteQuantitySize1:
          type: integer
          description: Total route maximum size1 quantity limits
        maxRouteQuantitySize2:
          type: integer
          description: Total route maximum size2 quantity limits
        maxRouteQuantitySize3:
          type: integer
          description: Total route maximum size3 quantity limits
        useMaxRouteQuantitySize1:
          type: boolean
          description: If the total route maximum size1 quantity limits should be used
        useMaxRouteQuantitySize2:
          type: boolean
          description: If the total route maximum size2 quantity limits should be used
        useMaxRouteQuantitySize3:
          type: boolean
          description: If the total route maximum size3 quantity limits should be used
        tripMinimumPercentOfCapacity:
          type: integer
          description: If the equipment's capacity must be met in order for a trip to be created
        tripMinimumPaidTime:
          description: Minimum run time for the trip minus any unpaid breaks
          allOf:
          - $ref: '#/components/schemas/Duration'
        allConsideredSizesMustMeetMinTripCapacity:
          type: boolean
          description: If all of the equipment's capacity must be met in order for a trip to be created
        mustMeetAllTripMinimums:
          type: boolean
          description: If the minimum percent of the trip's capacity must be met in order for a reloaded trip to be created
        reloadAfterLastStop:
          type: boolean
          description: If the equipment will automatically visit a depot and reload after the last serviceable stop
        nonGeographicReloading:
          type: boolean
          description: If orders are routed closest to the reload depot rather than returning to the previous trips geographic area.
        considerReloadDepotSkuRestrictions:
          type: boolean
          description: If the SKU's available at the depot, and the minimum quantities are considered when selecting the reload depot, as well as the origin depot (for deliveries) and the destination depot (for pickups)
        considerReloadDepotSkuCosts:
          type: boolean
          description: If the depot fees, depot SKU cost, and equipment type costs are considered when selecting the reload depot
        maximumNumberOfReloads:
          type: integer
          description: The maximum number of times the truck can be reloaded
        reloadAction:
          type: string
          description: The action that should occur when the truck goes to the reload depot
          example: AsNeeded
          enum:
          - AsNeeded
          - Full
          - Empty
          - None
        useOriginAsReloadDepot:
          type: boolean
          description: If the origin of the trip will be used for the reload location
        availableReloadDepotsEntityKeys:
          type: array
          description: The entity keys of the depots available for reloads
          items:
            type: integer
        fixedReloadTime:
          description: The fixed service time needed to reload the truck if it is being sent out for another trip
          allOf:
          - $ref: '#/components/schemas/Duration'
        variableReloadTime:
          description: The variable service time needed to reload the truck if it is being sent out for another trip
          allOf:
          - $ref: '#/components/schemas/Duration'
        useDepotServiceTimeForReloadTime:
          type: boolean
          description: If the depot's fixed and variable service time will be used when reloading
      x-omni-valid:
        PostPutPatchOptional:
        - enableCapacityReloads
        - enableRunTimeReloads
        - tripMaximumPaidTime
        - capacityReloadThresholdPercent
        - maxRouteQuantitySize1
        - maxRouteQuantitySize2
        - maxRouteQuantitySize3
        - useMaxRouteQuantitySize1
        - useMaxRouteQuantitySize2
        - useMaxRouteQuantitySize3
        - tripMinimumPercentOfCapacity
        - tripMinimumPaidTime
        - allConsideredSizesMustMeetMinTripCapacity
        - mustMeetAllTripMinimums
        - reloadAfterLastStop
        - nonGeographicReloading
        - considerReloadDepotSkuRestrictions
        - considerReloadDepotSkuCosts
        - maximumNumberOfReloads
        - reloadAction
        - useOriginAsReloadDepot
        - availableReloadDepotsEntityKeys
        - fixedReloadTime
        - variableReloadTime
        - useDepotServiceTimeForReloadTime
    MultiDayRoutingOptions:
      type: object
      properties:
        multiDayRoutingIsEnabled:
          type: boolean
          description: If Routing will dynamically create routes that span more than one day
        multiDayIsPaid:
          type: boolean
          description: If workers are paid during layovers
        recalculateLayoversAfterRouteCreation:
          type: boolean
          description: If layovers will be re-evaluated and reinserted based on the pass template when the routes change
        multiDayMaxLayovers:
          type: integer
          description: The maximum number of layovers that can be placed on a route
        departureTimeCalculationsType:
          type: string
          description: Specifies how the departure time for layovers will be calculated
          example: FixedDurationLayover
          enum:
          - FixedDurationLayover
          - FixedDepartureLayover
          - FixedArrivalAtNextStopLayover
        layoverDuration:
          description: Duration of the related `departureTimeCalculationsType`. Returned only when the `departureTimeCalculationsType` is `FixedDurationLayover`
          allOf:
          - $ref: '#/components/schemas/Duration'
        layoverTimeOfDay:
          description: Time of the related `departureTimeCalculationsType`. Returned only when the `departureTimeCalculationsType` is `FixedDepartureLayover` or `FixedArrivalAtNextStopLayover`
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
        minimumLayoverDuration:
          description: The minimum amount of time for a layover
          allOf:
          - $ref: '#/components/schemas/Duration'
        maximumLayoverDuration:
          description: The maximum amount of time for a layover
          allOf:
          - $ref: '#/components/schemas/Duration'
        useLayoverLocations:
          type: boolean
          description: If Routing will specify where workers will go to rest during their layovers, based on existing layover locations
        useIndeterminateLocation:
          type: boolean
          description: If Routing will schedule a layover without specifying where the location will occur and allow the worker to choose the location
      x-omni-valid:
        PostPutPatchOptional:
        - multiDayRoutingIsEnabled
        - multiDayIsPaid
        - recalculateLayoversAfterRouteCreation
        - multiDayMaxLayovers
        - departureTimeCalculationsType
        - layoverDuration
        - layoverTimeOfDay
        - minimumLayoverDuration
        - maximumLayoverDuration
        - useLayoverLocations
        - useIndeterminateLocation
    Session:
      type: object
      properties:
        entityKey:
          type: integer
          description: The routing session's EntityKey. The field is DEPRECATED for PlanningSession requests.
          example: 101
        date:
          type: string
          description: The date for the routing session must be provided when the EntityKey is omitted. The field is REQUIRED for PlanningSession requests.
          format: date
        description:
          type: string
          description: The description for the routing session must be provided with the date.
          example: Daily
      x-omni-valid:
        SessionIdentity:
        - date
        - description
        - entityKey
    Result:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        error:
          $ref: '#/components/schemas/Error'
  responses:
