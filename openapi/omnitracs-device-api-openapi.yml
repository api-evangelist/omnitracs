security:
- tokenAuth: []
tags:
- name: Device
  description: Devices are a piece of portable electronic equipment that can connect to the internet, especially a smartphone or tablet computer, you can associate a device with existing equipment. An electronic device can be a telematic device or mobile device.
paths:
  /admin/devices:
    get:
      tags:
      - Device
      summary: Device
      description: 'Available EXPAND parameters are:

        + TelematicsInfo

        + MobileInfo

        + NavigationInfo

        + All

        '
      operationId: getDevices
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DevicesExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      - name: lastEntityKey
        in: query
        schema:
          type: integer
        description: Use to retrieve only results that have an entity key greater than the passed in entity key
      - name: lastModifiedDateTime
        in: query
        schema:
          type: string
          format: date-time
        description: Use to retrieve only results that were modified on or after this date-time
      responses:
        200:
          $ref: '#/components/responses/GetDevicesResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Device
      summary: Device
      operationId: postDevices
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - identity
                      - regionVisibility
                      - deviceType
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionVisibility:
                          type: object
                          description: See [Administrative Hierarchy and Region Visibility](#section/Integration-Guidelines/Administrative-Hierarchy-and-Region-Visibility)
                          properties:
                            visibleInAllRegions:
                              type: boolean
                              example: false
                            regionIdentities:
                              type: array
                              description: Identifies which region(s) the data is organized within.
                              example:
                              - identifier: TESTBASEREGION
                              items:
                                type: object
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                        primaryRegionIdentity:
                          type: object
                          description: 'Identifies the Primary Region. Required for POST telematics devices only.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        description:
                          type: string
                          example: DEVICE01
                        active:
                          type: boolean
                          description: If the "active" property is not included in the payload when creating or updating an entity, its value will default to false.
                          example: true
                        devicePhoneNumber:
                          type: string
                          example: 7143496562
                        deviceType:
                          type: string
                          example: mobile
                          enum:
                          - mobile
                          - telematics
                        isTopLevelComplianceEntity:
                          type: boolean
                          example: false
                        navigationProperties:
                          type: object
                          properties:
                            systemOfOrigin:
                              type: string
                              example: RoadnetAnywhere
                              enum:
                              - RoadnetAnywhere
                              - CustomerPortal
                              - ServicesPortal
                          x-omni-valid:
                            CalculatedReadonly:
                            - mapVersion
                            - activationStatus
                            - isPreAuthenticated
                            PostPutPatchOptional:
                            - systemOfOrigin
                        associations:
                          type: object
                          properties:
                            equipmentIdentity:
                              type: object
                              description: Identity of the Equipment which usually is related with this Device. Before associating the Equipment with the Device, make sure that the Equipment is not related to any Device. If it is already related, remove the association first before creating a new one.
                              properties:
                                entityKey:
                                  type: integer
                                  description: To remove the association, use a value of -1 when using the PUT/PATCH methods
                                  example: -1
                                identifier:
                                  type: string
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                                PostPutPatchOptional:
                                - entityKey
                                - identifier
                            locationIdentity:
                              type: object
                              description: Identity of the Location where usually is sited this Device.
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
                                identifier:
                                  type: string
                                  description: Represents a value that the entity can be used for identification and labeling purposes.
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                            routeIdentity:
                              type: object
                              description: Identity of the Route where usually is used this Device.
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
                                identifier:
                                  type: string
                                  description: Represents a value that the entity can be used for identification and labeling purposes.
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                          x-omni-valid:
                            ReadonlyRelatedIdentity:
                            - equipmentIdentity
                            - locationIdentity
                            - routeIdentity
                        telematicsInfo:
                          type: object
                          description: Required if the entity is of this type
                          required:
                          - hardwarePlatform
                          - providerType
                          properties:
                            blueToothAddress:
                              type: string
                            currentSystemInfo:
                              type: object
                              description: '**DEPRECATED:** The currentSystemInfo property has been deprecated in favor of readOnly behavior changes for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                              properties:
                                firmwareVersion:
                                  type: string
                                  description: '**DEPRECATED:** The firmwareVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: 83a
                                scriptVersion:
                                  type: string
                                  description: '**DEPRECATED:** The scriptVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: 41.3
                                vehicleDatabaseVersion:
                                  type: string
                                  description: '**DEPRECATED:** The vehicleDatabaseVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: V01.03.01.43
                                vehicleInterfaceFirmwareVersion:
                                  type: string
                                  description: '**DEPRECATED:** The vehicleInterfaceFirmwareVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: V01.03.01.65
                              x-omni-valid:
                                PostPutPatchOptional:
                                - firmwareVersion
                                - scriptVersion
                                - vehicleDatabaseVersion
                                - vehicleInterfaceFirmwareVersion
                            pendingSystemInfo:
                              type: object
                              description: '**DEPRECATED:** The pendingSystemInfo property has been deprecated in favor of readOnly behavior changes for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                              properties:
                                firmwareVersion:
                                  type: string
                                  description: '**DEPRECATED:** The firmwareVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: 83a
                                scriptVersion:
                                  type: string
                                  description: '**DEPRECATED:** The scriptVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: 41.3
                                vehicleDatabaseVersion:
                                  type: string
                                  description: '**DEPRECATED:** The vehicleDatabaseVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: V01.03.01.43
                                vehicleInterfaceFirmwareVersion:
                                  type: string
                                  description: '**DEPRECATED:** The vehicleInterfaceFirmwareVersion property has been deprecated for POST, PUT and PATCH operations only. Use of this property is discouraged, and later versions of this specification will likely remove it.'
                                  example: V01.03.01.65
                              x-omni-valid:
                                PostPutPatchOptional:
                                - firmwareVersion
                                - scriptVersion
                                - vehicleDatabaseVersion
                                - vehicleInterfaceFirmwareVersion
                            isOmnitracsNavigation:
                              type: boolean
                            isOmnitracsNavigationPlus:
                              type: boolean
                            isVoiceNavigation:
                              type: boolean
                            inputFields:
                              type: array
                              description: Set of inputs primarily associated with the ports of Roadnet Telematic devices. These fields are designed to capture and store values dependent on any accessories or switches installed. The data stored in these fields is retained but not reapplied or processed further.
                              items:
                                type: boolean
                            telematicsDeviceHardware:
                              type: object
                              properties:
                                hasEngineDeratingDevice:
                                  type: boolean
                                hasIgnitionKillSwitch:
                                  type: boolean
                              x-omni-valid:
                                PostPutPatchOptional:
                                - hasEngineDeratingDevice
                                - hasIgnitionKillSwitch
                            isThirdPartyDevice:
                              type: boolean
                            model:
                              type: string
                            hardwarePlatform:
                              type: string
                              description: 'Please consider the following valid combinations between ProviderType and HardwarePlatform Roadnet&RoadnetTelematics, XRS&Relay, XRS&IVGB, Omnitracs&SkyBitz, Omnitracs&TT150, Omnitracs&TT100, Omnitracs&TT210, Omnitracs&TTID, Omnitracs&TT200, Omnitracs&Brightdrop, Omnitracs&Geometris, Unspecified&Roadnet.


                                **Important**: The following hardware platforms are auto-provisioned and its manual addition or deletion is disabled:

                                - AMGC

                                - SR4

                                - SR5


                                Required for Telematics Device only.

                                '
                              example: Relay
                              enum:
                              - Unspecified
