    WorkerLogsBaseDetailInfo:
      type: object
      description: includes specific log events provided in the log details table in a driver log report - since these are events, the same info can be obtained in the Events service.
      properties:
        address:
          $ref: '#/components/schemas/Address'
        comment:
          type: string
          example: Some Comment
        current:
          type: boolean
          example: true
        workerIdentity:
          $ref: '#/components/schemas/Identity'
        coWorkerIdentity:
          $ref: '#/components/schemas/Identity'
        editedDate:
          type: string
          description: This property marks the moment a user requested a change to the log entry, such as an update to the duty status or a correction to the recorded time. "editedDate" captures the specific point in time when the edit was made, prior to any approval or confirmation. This property is returned in UTC time.
          format: date-Time
        eventType:
          type: string
          description: This field is equivalent to the column labeled "Event" in the driver log report.
          example: RouteStarted
        locationName:
          type: string
          example: Location Name
        modifiedDate:
          type: string
          description: This property denotes the timestamp when the event is stored on the server. In the scenario of a log edit, it represents the timestamp at which the modifications are officially acknowledged on the server. It serves as the reference date for selecting worker status events when a specific time-frame is specified in the request, regardless of the timeSource value provided. This property is returned in UTC time.
          format: date-Time
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        recordEntityKey:
          description: This field is the unique identity key for the log detail.  In some cases a "-1" value can be returned, such as when a "Day End" event is received indicating the driver has moved past midnight in their logs.
          allOf:
          - $ref: '#/components/schemas/EntityKeyOnlyIdentity'
        recordTime:
          type: string
          description: Date the original event was created on the drivers mobile device prior to any edits. This property is returned in the drivers local time.
          format: date-Time
        detail:
          type: string
          description: This field is called "Remark" in the column labeled "Detail" in the driver log report.
        rowId:
          type: string
        sequence:
          type: string
        locationIdentity:
          $ref: '#/components/schemas/Identity'
        vehicleIdentity:
          $ref: '#/components/schemas/Identity'
        recordTimeUTC:
          description: Date the original event was created on the drivers mobile device prior to any edits. This property is returned in UTC time.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        odometer:
          description: Some events such as "LoginOrLogout" will not return an odometer property
          allOf:
          - $ref: '#/components/schemas/Distance'
      x-omni-valid:
        CalculatedReadonly:
        - address
        - comment
        - current
        - workerIdentity
        - coWorkerIdentity
        - editedDate
        - eventType
        - locationName
        - modifiedDate
        - coordinate
        - recordEntityKey
        - recordTime
        - detail
        - rowId
        - sequence
        - locationIdentity
        - vehicleIdentity
        - recordTimeUTC
        - odometer
