security:
- tokenAuth: []
tags:
- name: Events
  description: "Events are a way for subscribers to be notified about certain route, stop, worker and equipment events. For instance, one subscriber could receive events when a driver arrives or departs a stop, while another subscriber could receive events when a driver logs into a mobile device. \nAn event subscriber must be configured through the client before any events can be retrieved.\n\n**Best Practices:** Events can occur very frequently, best practice would be calling this endopoint regularly with the **beginDate** and **endDate** parameters defined. It is also recommended to include both the **pageIndex** and **pageSize** parameters for paging.\n\n**Region filtering:** Region filtering is based on the event type and the **main entity** associated with each type. Only events whose main entity is assigned or shared to the region specified will be returned.\n\nEntity-to-region filtering mapping:\n- Events of type: `Route`, `Stop`, `DriverTask`, `SendOrders` are filtered by the **Route's region**\n- Events of type: `IgnitionStatusChanged` are filtered by the **TelematicDevice's region**\n- Events of type: `WorkerStatusChanged` are filtered by the **Worker's region**\n- Events of type: `CriticalEvent` are filtered by the **Equipment's region**\n- Events of type: `FaultCode`, available to **all regions**\n\nNote: If an event's main entity is not assigned or shared to a region, it will be excluded from region-filtered responses.\n"
paths:
  /events/{subscriber}:
    get:
      tags:
      - Events
      summary: Events
      description: ''
      operationId: getEvents
      parameters:
      - name: subscriber
        in: path
        required: true
        schema:
          type: string
        description: Identifier of the Event Subscriber for which to get Events. Must be provided for all requests.
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: beginDate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines a start date-time from which events after this date will be returned. If a timeSource of "System" is defined, then this date-time refers to the "systemTimeStamp", which is the time the event was saved to the server.  If a timeSource of "Device" is defined, then this date-time refers to the "eventTimestamp" which is the time the event was recorded on the device. Worker status events are always selected by the "modifiedDate" in the "workerLogDetailInfo" object regardless of which "timeSource" parameter is passed in.
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines an end date-time from which events before this date will be returned, ignored if no start date is supplied. If a timeSource of "System" is defined, then this date-time refers to the "systemTimeStamp", which is the time the event was saved to the server.  If a timeSource of "Device" is defined, then this date-time refers to the "eventTimestamp" which is the time the event was recorded on the device. Worker status events are always selected by the "modifiedDate" in the "workerLogDetailInfo" object regardless of which "timeSource" parameter is passed in.
      - name: timeSource
        in: query
        schema:
          type: string
          enum:
          - Device
          - System
        description: Determines whether the begin and end timestamps are from the device time or the system time. Worker status events are always selected by the "modifiedDate" in the "workerLogDetailInfo" object regardless of which "timeSource" parameter is passed in.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      responses:
        200:
          $ref: '#/components/responses/GetEventsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
    StopType:
      type: string
      example: OriginDepotStop
      enum:
      - OriginDepotStop
      - DestinationDepotStop
      - MidrouteDepotStop
      - ServiceableStop
      - BreakStop
      - LayoverStop
      - MaintenanceStop
      - UnknownStop
      - DiversionStop
    StopEventOrderLineItem:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        skuIdentity:
          $ref: '#/components/schemas/Identity'
        quantities:
          $ref: '#/components/schemas/OSDQuantities'
          deprecated: This property has been deprecated use the property odsQuantities instead
        odsQuantities:
          type: array
          description: A list of OSD (Over, Short, Damaged) quantities associated with this line item. The odsQuantities property values will not return in the response unless there is a reasonCode specified.
          items:
            $ref: '#/components/schemas/OSDQuantities'
        hazmatTypes:
          type: array
          items:
            $ref: '#/components/schemas/HazmatType'
        customProperties:
          type: array
          description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
          items:
            $ref: '#/components/schemas/CustomProperty'
      x-omni-valid:
        CalculatedReadonly:
        - identity
        - skuIdentity
        - hazmatTypes
        - odsQuantities
        MonolithicChildCollection:
        - customProperties
        DeprecatedCalculated:
        - quantities
    RouteTimestamps:
      type: object
      properties:
        started:
          $ref: '#/components/schemas/Timestamp'
        departed:
          $ref: '#/components/schemas/Timestamp'
        arrived:
          $ref: '#/components/schemas/Timestamp'
        completed:
          $ref: '#/components/schemas/Timestamp'
      x-omni-valid:
        CalculatedReadonly:
        - started
        - departed
        - arrived
        - completed
    StopEventOrderQuantities:
      type: object
      properties:
        actual:
          description: Calculated rollups of Actual delivered or picked up quantities
          allOf:
          - $ref: '#/components/schemas/Quantities'
        over:
          description: Calculated rollups of overage quantities
          allOf:
          - $ref: '#/components/schemas/Quantities'
        short:
          description: Calculated rollups of shortage quantities
          allOf:
          - $ref: '#/components/schemas/Quantities'
        damaged:
          description: Calculated rollups of damaged quantities
          allOf:
          - $ref: '#/components/schemas/Quantities'
      x-omni-valid:
        CalculatedReadonly:
        - actual
        - over
        - short
        - damaged
    OSDQuantities:
      type: object
      properties:
        quantities:
          $ref: '#/components/schemas/Quantities'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
      x-omni-valid:
        CalculatedReadonly:
        - quantities
        - reasonCode
    WorkerEventViolationInfo:
      type: object
      description: includes all violation info related to the worker
      properties:
        remark:
          type: string
        createTime:
          description: The time that particular event is generated on the device
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        locationName:
          type: string
        hosRuleName:
          type: string
        hosRuleDescription:
          type: string
        violationText:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        recordTime:
          description: The time that a violation occurred and successfully saved
          allOf:
          - $ref: '#/components/schemas/Timestamp'
      x-omni-valid:
        CalculatedReadonly:
        - remark
        - createTime
        - locationName
        - hosRuleName
        - hosRuleDescription
        - violationText
        - latitude
        - longitude
        - recordTime
    Event:
      type: object
      description: A system generated event available to subscribers. Read Only entity, only GET available
      properties:
        subscriberIdentity:
          $ref: '#/components/schemas/Identity'
        eventType:
          type: string
          example: StopArrived
          enum:
          - StopArrived
          - StopDeparted
          - StopServicing
          - StopCancelled
          - StopSequenceChanged
          - StopDeliveryDetailsChanged
          - RouteStatusChanged
          - RouteStarted
          - RouteDeparted
          - RouteArrived
          - RouteCompleted
          - RouteChanged
          - WorkerStatusChanged
          - CriticalEvent
          - IgnitionStatusChanged
          - FaultCode
          - DriveTask
          - SendOrders
        eventInfo:
          $ref: '#/components/schemas/EventInfo'
        systemTimestamp:
          description: In most cases, this property denotes the timestamp when the event is stored on the server. However, for worker status events, this is the date that the original event was created on the drivers mobile device prior to any edits. This property is returned in UTC time.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        eventHash:
          type: string
          example: 20180203073000
        eventTimestamp:
          description: This property denotes the timestamp when the event occurred. For worker status events, this is the date that the original event was created on the drivers mobile device prior to any edits. This property is returned in UTC time.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
      x-omni-valid:
        CalculatedReadonly:
        - subscriberIdentity
        - eventType
        - eventInfo
        - systemTimestamp
        - eventHash
        - eventTimestamp
    RouteTotals:
      type: object
      properties:
        distance:
          $ref: '#/components/schemas/Distance'
        routeTime:
          description: Total time the Route has been in progress in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        travelTime:
          description: Total time the Route has been traveling in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        serviceTime:
          description: Total time the Route has been servicing stops in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
      x-omni-valid:
        CalculatedReadonly:
        - distance
        - routeTime
        - travelTime
        - serviceTime
    GetEntityResponse:
      type: object
    StopEventOrderInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        quantities:
          $ref: '#/components/schemas/StopEventOrderQuantities'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/StopEventOrderLineItem'
        customProperties:
          type: array
          description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
          items:
            $ref: '#/components/schemas/CustomProperty'
      x-omni-valid:
        CalculatedReadonly:
        - identity
        - quantities
        - lineItems
        MonolithicChildCollection:
        - customProperties
    HazmatTypeFlags:
      type: string
      example: Class2
      enum:
      - None
      - Class1
      - Class2
      - Class3
      - Class4
      - Class5
      - Class6
      - Class7
      - Class8
      - Class9
    Distance:
      type: object
      properties:
        value:
          type: number
          example: 120
        unit:
          type: string
          example: Kilometers
          enum:
          - Miles
          - Kilometers
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    ReasonCode:
      type: object
      properties:
        type:
          type: string
          example: Delivery
          enum:
          - Delivery
