          description: Order Class associates the item with a set of Service Time and Service Window parameters.
          allOf:
          - $ref: '#/components/schemas/Identity'
        daysOfWeek:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DayOfWeek'
        startTimeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
        endTimeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
      x-omni-valid:
        RequiredRelatedIdentity:
        - orderClassIdentity
        PostPutPatchRequired:
        - daysOfWeek
        - startTimeOfDay
        - endTimeOfDay
    ServiceArea:
      type: object
      description: "A geospatial boundary, represented as either a polygon or a circle. \n\nIn the context of **Territories**, an \"areaType\" of \"polygon\" with no \"polygonInfo\" indicates that no boundary has been configured, i.e., no coordinate points are defined for the territory.\n"
      properties:
        radiusInfo:
          description: A distance indicating the radius of a circular service area
          allOf:
          - $ref: '#/components/schemas/Distance'
        polygonInfo:
          description: A polygon indicating the closed irregular shape of a service area. Returned only if an advanced Geofence is configured for the location.
          allOf:
          - $ref: '#/components/schemas/Polygon'
        areaType:
          type: string
          description: Each area info should be provided with one corresponding area type
          example: Radius
          enum:
          - Radius
          - Polygon
      x-omni-valid:
        TypeInfo:
        - radiusInfo
        - polygonInfo
        TypeDiscriminator:
        - areaType
    GetEntityResponse:
      type: object
    ServiceLocationInfo:
      type: object
      properties:
        serviceTimeTypeIdentity:
          $ref: '#/components/schemas/Identity'
        timeWindowTypeIdentity:
          $ref: '#/components/schemas/Identity'
        deliveryDays:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DayOfWeek'
        overrides:
          description: "Only populated if the `overrides` or `all` EXPAND option is set for a GET request. In a PATCH or PUT operation, the entire entity will be replaced so it is recommended to include all properties when modifying an override object \n"
          allOf:
          - $ref: '#/components/schemas/ServiceLocationOverrides'
        storeNumber:
          type: string
        priority:
          type: integer
          description: Routing priority.  Higher priorities are placed earlier in the route. 0 = lowest, 9 = highest.
          example: 3
        buildingDeliverySequence:
          type: integer
          description: Delivery sequence to use when multiple service locations exist at the same geographic location.
          example: 1
        preferredRouteIdentifier:
          type: string
          description: 'The unique ID of the route that the order should be placed on. If a preferred route ID is specified, the order will be placed on that route,

            unless you manually place the order on a different route or specify that this requirement can be ignored.

            '
          example: ROUTE2
        timeWindowImportance:
          type: string
          description: Indicates importance of arriving during specified time windows.
          example: Normal
          enum:
          - Lowest
          - Lower
          - Normal
          - Higher
          - Highest
          - MustMake
        activeAlertSubscriptions:
          type: array
          description: "Active Alert Subscriptions refer to the set of alert notifications configured for a specific Location. Each subscription corresponds to a Recipient and Recipient Type, with three available Notification Methods: Email, SMS, and WhatsApp.\n\nWhen a request is made to create an Active Alert Subscription for a particular Notification Method (e.g., SMS), **the system generates a subscription for all three Notification Methods by default**.\nHowever, **only the subscription for the requested method will have a defined MessageType**. The other notification methods will be created with a MessageType of '**None**', meaning they are not active or operable.\n\n\nOnly subscriptions with a defined MessageType are considered valid and functional. \nSubscriptions with a MessageType set to 'None' are placeholders and do not trigger any alerts.\n"
          items:
            $ref: '#/components/schemas/ServiceLocationActiveAlertSubscriptionEx'
        customProperties:
          type: array
          description: 'DEPRECATED: Custom properties should be set on the root location object as it takes precendence over location infos for a POST/PUT/PATCH.'
          items:
            $ref: '#/components/schemas/CustomProperty'
