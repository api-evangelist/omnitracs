security:
- tokenAuth: []
tags:
- name: Location
  description: Locations are generally the customers you deliver to, although they could also be the vendors from whom you have purchased products or other places you may send a piece of equipment. When you add service locations, you need to provide some basic information such as an address and service information. The address is used to determine where the service location is located; this is called its geocode. The service information is used to determine when you should service the location, as well as how long it should take to service the location. The Service Locations - Service Window Overrides allows you to enter service window for specific days. Any service window entered here will override the service window for the service location's selected type.
paths:
  /admin/locations:
    get:
      tags:
      - Location
      summary: Location
      description: 'Available EXPAND parameters are:

        + Overrides

        + ExcludeEquipmentRestrictions

        '
      operationId: getLocations
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/LocationExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      - name: lastEntityKey
        in: query
        schema:
          type: integer
        description: Use to retrieve only results that have an entity key greater than the passed in entity key
      - name: lastModifiedDateTime
        in: query
        schema:
          type: string
          format: date-time
        description: Use to retrieve only results that were modified on or after this date-time
      responses:
        200:
          $ref: '#/components/responses/GetLocationsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Location
      summary: Location
      operationId: postLocations
      parameters:
      - name: geocode
        in: query
        schema:
          type: boolean
        description: Should attempt to geocode the location.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - identity
                      - regionVisibility
                      - locationType
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionVisibility:
                          type: object
                          description: See [Administrative Hierarchy and Region Visibility](#section/Integration-Guidelines/Administrative-Hierarchy-and-Region-Visibility)
                          properties:
                            visibleInAllRegions:
                              type: boolean
                              example: false
                            regionIdentities:
                              type: array
                              description: Identifies which region(s) the data is organized within.
                              example:
                              - identifier: TESTBASEREGION
                              items:
                                type: object
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                        primaryRegionIdentity:
                          type: object
                          description: 'Identifies the Primary Region. Required for POST telematics devices only.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        locationType:
                          type: string
                          example: Service
                          enum:
                          - Service
                          - Depot
                          - Restricted
                          - Layover
                          - Fuel
                          - Maintenance
                          - Landmark
                        accountIdentity:
                          type: object
                          description: 'Accounts are an optional way of grouping locations together for the same client, buyer, or purchaser.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        locationCategoryIdentity:
                          type: object
                          description: 'Optional relation to a category for this location


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        address:
                          type: object
                          properties:
                            addressLine1:
                              type: string
                              example: 849 Fairmount
                            addressLine2:
                              type: string
                              example: Ave
                            city:
                              type: string
                              example: Towson
                            county:
                              type: string
                              example: default
                            stateOrProvince:
                              type: string
                              description: When posting or updating (POST, PUT, PATCH), both the standard 2-letter abbreviation or the complete name for state or province can be provided ("AZ"/"Arizona").
                              example: MD
                            postalCode:
                              type: string
                              example: 21286
                            country:
                              type: string
                              description: Standard 3-letter country code (ISO 3166-1 alpha-3)
                              example: USA
                              enum:
                              - USA
                              - CAN
                              - MEX
                          x-omni-valid:
                            PostPutPatchOptional:
                            - addressLine1
                            - addressLine2
                            - stateOrProvince
                            - county
                            - city
                            - country
                            PostalCode:
                            - postalCode
                        contact:
                          type: object
                          properties:
                            firstName:
                              type: string
                              example: Chris
                            middleName:
                              type: string
                              example: D
                            lastName:
                              type: string
                              example: Walker
                            phoneNumber:
                              type: string
                              example: 7143496562
                            faxNumber:
                              type: string
                              example: 1619998888
                          x-omni-valid:
                            PostPutPatchOptional:
                            - firstName
                            - middleName
                            - lastName
                            - phoneNumber
                            - faxNumber
                        alternateContact:
                          type: object
                          properties:
                            firstName:
                              type: string
                              example: Max
                            middleName:
                              type: string
                              example: B
                            lastName:
                              type: string
                              example: Oconner
                            phoneNumber:
                              type: string
                              example: 7143496561
                          x-omni-valid:
                            PostPutPatchOptional:
                            - firstName
                            - middleName
                            - lastName
                            - phoneNumber
                        coordinate:
                          type: object
                          example:
                            latitude: 32.785422
                            longitude: -96.79748
                          required:
                          - latitude
                          - longitude
                          properties:
                            latitude:
                              type: number
                              maximum: 90
                              minimum: -90
                              example: 32.785422
                            longitude:
                              type: number
                              maximum: 180
                              minimum: -180
                              example: -96.79748
                          x-omni-valid:
                            PostPutPatchRequired:
                            - latitude
                            - longitude
                        description:
                          type: string
                        yard:
                          type: boolean
                          description: Indicates whether the location is a yard (true) or not (false).
                          example: true
                        standardInstructions:
                          type: string
                          example: Standard Instructions here
                        timeZone:
