                                      type: string
                                      enum:
                                      - InitialServiceStartWindow
                                      - ServiceStartWindowChanged
                                      - Serviced
                                      - Cancelled
                                      - Unserviceable
                                      - MissedServiceWindow
                                      - BeforeServiceStartTime
                                      - Arrived
                                      - Scheduled
                                      - Rescheduled
                                      - None
