          example: 1
      x-omni-valid:
        PrimaryIdentity:
        - identity
        SystemGeneratedReadonly:
        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    GetLocationByEntityKeyResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
