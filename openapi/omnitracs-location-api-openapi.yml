                              description: "Active Alert Subscriptions refer to the set of alert notifications configured for a specific Location. Each subscription corresponds to a Recipient and Recipient Type, with three available Notification Methods: Email, SMS, and WhatsApp.\n\nWhen a request is made to create an Active Alert Subscription for a particular Notification Method (e.g., SMS), **the system generates a subscription for all three Notification Methods by default**.\nHowever, **only the subscription for the requested method will have a defined MessageType**. The other notification methods will be created with a MessageType of '**None**', meaning they are not active or operable.\n\n\nOnly subscriptions with a defined MessageType are considered valid and functional. \nSubscriptions with a MessageType set to 'None' are placeholders and do not trigger any alerts.\n"
