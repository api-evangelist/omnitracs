        identity:
          $ref: '#/components/schemas/EntityKeyOnlyIdentity'
        authorizedBy:
          type: string
          example: test@email.com
        messageTypes:
          type: array
          description: Defines the types of Alert
          items:
            $ref: '#/components/schemas/MessageType'
        authorizedTime:
          type: string
          description: The time in which the Active Alert was created or updated
          format: date-Time
        beforeServiceStartTimePeriod:
          type: integer
          description: Refers to a specific time frame at which the alert will be triggered before the expected service time at the given location. Required if MessageTypes include 'BeforeServiceStartTime'
          example: 6
        lastUpdatedByRecipient:
          type: boolean
          description: Boolean value indicating whether the last update for the Active Alert was made by the recipient or not.
        overrideUserPreferences:
          type: boolean
          description: Indicates whether the system should override subscription settings in cases where subscription has been modified by the recipient.
        notificationMethod:
          type: string
          description: Method the Active Alert is set to use
          example: Email
          enum:
          - Email
          - SMS
          - WhatsApp
          - MobileApp
          - DSDMobileApp
        recipientTypeIdentity:
          $ref: '#/components/schemas/Identity'
        recipientIdentity:
          $ref: '#/components/schemas/Identity'
      x-omni-valid:
        PatchRequired:
        - identity
        AlwaysRequired:
        - notificationMethod
        - messageTypes
        RequiredRelatedIdentity:
        - recipientTypeIdentity
        - recipientIdentity
        AlwaysOptional:
        - beforeServiceStartTimePeriod
        - overrideUserPreferences
        SystemGeneratedReadonly:
        - authorizedBy
        - authorizedTime
        CalculatedReadonly:
        - lastUpdatedByRecipient
    Country:
      type: string
      description: Standard 3-letter country code (ISO 3166-1 alpha-3)
      example: USA
      enum:
      - USA
      - CAN
      - MEX
    FuelLocationInfo:
      type: object
      properties:
        fuelPrice:
          type: number
          example: 30
        fuelPriceEffectiveDate:
          type: string
          format: date
        additionalFixedTravelTime:
          allOf:
          - $ref: '#/components/schemas/Duration'
      x-omni-valid:
        PostPutPatchOptional:
        - fuelPrice
        - fuelPriceEffectiveDate
        - additionalFixedTravelTime
