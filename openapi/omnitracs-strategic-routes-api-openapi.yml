security:
- tokenAuth: []
tags:
- name: Strategic Routes
  description: Strategic Routes have information for individual routes within a Territory.
paths:
  /strategicplan/strategicRoutes:
    get:
      tags:
      - Strategic Routes
      summary: StrategicRoutes
      description: 'NOTE: Retrieve strategic routes.

        '
      operationId: getStrategicRoutes
      parameters:
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: sessionDate
        in: query
        schema:
          type: string
          format: date
        description: The Strategic Session Date from which data is retrieved.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StrategicRouteExpand'
        description: Comma delimited list of fields to expand.
      - name: territoryKey
        in: query
        style: form
        schema:
          type: string
        description: Entity key for a territory.
      responses:
        200:
          $ref: '#/components/responses/GetStrategicRoutesResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /strategicplan/strategicRoutes/{entityKey}:
    get:
      tags:
      - Strategic Routes
      summary: StrategicRoutes By Entity Key
      description: 'NOTE: Retrieve strategic route by entity key.

        '
      operationId: getStrategicRouteByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StrategicRouteExpand'
        description: Comma delimited list of fields to expand.
      responses:
        200:
          $ref: '#/components/responses/GetStrategicRouteByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
    StopType:
      type: string
      example: OriginDepotStop
      enum:
      - OriginDepotStop
      - DestinationDepotStop
      - MidrouteDepotStop
      - ServiceableStop
      - BreakStop
      - LayoverStop
      - MaintenanceStop
      - UnknownStop
      - DiversionStop
    StrategicRoutesContainer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StrategicRoute'
      x-omni-valid:
        AlwaysRequired:
        - items
    OriginDepotStopLocationInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        description:
          type: string
          example: Origin Depot Stop Location
        timeZone:
          $ref: '#/components/schemas/TimeZone'
      x-omni-valid:
        EmbeddedRelatedIdentity:
        - identity
        CalculatedReadonly:
        - description
        - timeZone
    Entity:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        createdBy:
          type: string
          example: tester@test.com
        createdTimestamp:
          $ref: '#/components/schemas/Timestamp'
        modifiedBy:
          type: string
          example: tester@test.com
        modifiedTimestamp:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          description: Version number of the entity.  In PUT/PATCH operations, if this field is included then the number will be compared with the current version of the entity, and an error returned if they do not match.
          example: 1
      x-omni-valid:
        PrimaryIdentity:
        - identity
        SystemGeneratedReadonly:
        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    CategoryQuantities:
      type: object
      properties:
        category1Quantities:
          $ref: '#/components/schemas/Quantities'
        category2Quantities:
          $ref: '#/components/schemas/Quantities'
        category3Quantities:
          $ref: '#/components/schemas/Quantities'
      x-omni-valid:
        MonolithicChildCollection:
        - category1Quantities
        - category2Quantities
        - category3Quantities
        PostPutOptional:
        - category1Quantities
        - category2Quantities
        - category3Quantities
    FixedDeparture:
      type: object
      properties:
        departureTimeOfDay:
          description: Layover will complete at the specified time of day
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
      x-omni-valid:
        PostPutPatchRequired:
        - departureTimeOfDay
    IdentifierOnlyIdentity:
      type: object
      properties:
        identifier:
          type: string
          example: TESTIDENTIFIER
      x-omni-valid:
        AlwaysRequired:
        - identifier
    RoutedOrderInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/IdentifierOnlyIdentity'
        beginDate:
          type: string
          description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
          format: date
        customProperties:
          type: array
          description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
          items:
            $ref: '#/components/schemas/CustomProperty'
        endDate:
          type: string
          description: The Begin and End dates represent the allowable range for service of this Order. If values are not provided, Begin will be set to the Session date and End will be null.
          format: date
        specialInstructions:
          type: string
          example: special instructions
        selector:
          type: string
          format: uppercase
          maxLength: 1
          minLength: 1
          pattern: ^[A-Z]{1}$
          example: S
        requiredRouteOriginDepotIdentity:
          description: Depot from which the route containing this order must originate.
          allOf:
          - $ref: '#/components/schemas/Identity'
        orderClassIdentity:
          description: Order Class associates the item with a set of Service Time and Service Window parameters.
          allOf:
          - $ref: '#/components/schemas/Identity'
        urgency:
          type: integer
          description: The importance of the order, which impacts its preference for the routing algorithms
          maximum: 100
          minimum: 0
          example: 76
        urgencyIncrease:
          type: integer
          description: If needed, the amount to increase the order urgency
          maximum: 100
          minimum: 0
          example: 10
        totalDeliveryQuantities:
          description: Calculated rollups
          allOf:
          - $ref: '#/components/schemas/Quantities'
        totalPickupQuantities:
          description: Calculated rollups
          allOf:
          - $ref: '#/components/schemas/Quantities'
        plannedDeliveryCategoryQuantities:
          description: Delivery Category Quantities
          allOf:
          - $ref: '#/components/schemas/CategoryQuantities'
        plannedPickupCategoryQuantities:
          description: Pickup Category Quantities
          allOf:
          - $ref: '#/components/schemas/CategoryQuantities'
        hazmatTypes:
          type: array
          description: Array of Hazmat Type, types can only be specified once per array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/HazmatType'
        workflowExtensions:
          type: array
          description: Workflow Extensions for the Order. These are displayed in the Drive app for the driver as level 3 custom properties.
          items:
            $ref: '#/components/schemas/WorkflowExtension'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/RoutedWorkerTaskInfo'
        forceBulkServiceTime:
          type: boolean
          description: 'Indicates whether the order is being forced to use bulk service times, even if the quantity does not meet the bulk threshold.

            If any order on the stop has Force Bulk selected, it will be selected for all orders on the stop.

            '
          example: false
      x-omni-valid:
        PostPutPatchRequired:
        - tasks
        PostPutOptional:
        - workflowExtensions
        PostPutPatchOptional:
        - beginDate
        - endDate
        - specialInstructions
        - selector
        - urgency
        - urgencyIncrease
        - hazmatTypes
        - plannedDeliveryCategoryQuantities
        - plannedPickupCategoryQuantities
        - forceBulkServiceTime
        OptionalRelatedIdentity:
        - requiredRouteOriginDepotIdentity
        EmbeddedRelatedIdentity:
        - identity
        RequiredRelatedIdentity:
        - orderClassIdentity
        CalculatedReadonly:
        - totalDeliveryQuantities
        - totalPickupQuantities
        MonolithicChildCollection:
        - workflowExtensions
        - customProperties
    RoutedWorkerTaskInfo:
      type: object
      description: Represents one step of work that needs to be completed to fulfill the Order.
      properties:
        quantities:
          description: If using line item detail, then Quantities are calculated rollups of Line Item Quantities.  Otherwise, they are the set-able Quantities of the Task.
          allOf:
          - $ref: '#/components/schemas/Quantities'
        taskType:
          type: string
          example: Pickup
          enum:
          - Pickup
          - Delivery
        lineItems:
          type: array
          description: Line items that comprise the Order.  Line items are only relevant if the system is configured to use line items.
          items:
            $ref: '#/components/schemas/LineItem'
        priorityOverride:
          type: integer
          description: Overrides a location priority
          maximum: 10
          minimum: 0
          example: 6
        overrides:
          description: Open/Close and Service Window Overrides - note entire override should be supplied on PATCH or PUT, Open/Close and Service Windows can not be separately updated.
          allOf:
          - $ref: '#/components/schemas/ServiceOverrides'
      x-omni-valid:
        AlwaysRequired:
        - taskType
        TaskQuantitiesLineItems:
        - lineItems
        - quantities
        PostPutPatchOptional:
        - priorityOverride
        PostPutOptional:
        - overrides
        MonolithicChildCollection:
        - overrides
    GetEntityResponse:
      type: object
    MaintenanceStopLocationInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        description:
          type: string
          example: Maintenance Stop Location
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/PersonName'
        standardInstructions:
          type: string
          example: Standard Instructions
        coordinate:
          allOf:
          - $ref: '#/components/schemas/Coordinate'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
      x-omni-valid:
        EmbeddedRelatedIdentity:
        - identity
        CalculatedReadonly:
        - description
        - address
        - contact
        - locationInfo
        - standardInstructions
        - coordinate
        - timeZone
    HazmatTypeFlags:
      type: string
      example: Class2
      enum:
      - None
      - Class1
      - Class2
      - Class3
      - Class4
      - Class5
      - Class6
      - Class7
      - Class8
      - Class9
    Distance:
      type: object
      properties:
        value:
          type: number
          example: 120
        unit:
          type: string
          example: Kilometers
          enum:
          - Miles
          - Kilometers
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
