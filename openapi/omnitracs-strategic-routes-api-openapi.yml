          - $ref: '#/components/schemas/LayoverStop'
        maintenanceStopInfo:
          description: A stop at a maintenance location.
          allOf:
          - $ref: '#/components/schemas/MaintenanceStop'
        workflowExtensions:
          type: array
          description: Workflow Extensions for the Stop. These are displayed in the Drive app for the driver as level 2 custom properties.
          items:
            $ref: '#/components/schemas/WorkflowExtension'
      x-omni-valid:
        TypeInfo:
        - originDepotStopInfo
        - destinationDepotStopInfo
        - midrouteDepotStopInfo
        - serviceableStopInfo
        - breakStopInfo
        - layoverStopInfo
        - maintenanceStopInfo
        TypeDiscriminator:
        - stopType
        PostPutPatchOptional:
        - workflowStopType
        PostPutOptional:
        - workflowExtensions
        MonolithicChildCollection:
        - workflowExtensions
    WorkflowExtension:
      type: object
      description: Workflow Extensions for Routes, Stops, Orders, and Line Items. These are displayed in the Drive app for the driver as custom properties.
      properties:
        label:
          type: string
          description: Label for the custom property.
          example: TESTLABEL
        value:
          type: string
          description: Value for the custom property.
          example: TESTVALUE
        permissions:
          type: string
          example: ReadWrite
          enum:
          - ReadOnly
          - ReadWrite
        sort:
          type: integer
          description: If specified, will be used for sorting; otherwise, the properties will be sorted by the label.
          example: 2
        type:
          type: string
          example: Input
          enum:
          - Url
          - Input
          - File
          - Json
        hidden:
          type: boolean
          description: If true, the custom property will NOT be displayed to the driver.
          example: true
        showInPlanner:
          type: boolean
          description: Supported for only Route and Stop level Workflow Entensions. If set to true, the custom property will be shown on the Drive trip planner screen as additional information in the trip and stop headers.
          example: false
      x-omni-valid:
        PostPutOptional:
        - label
        - value
        - permissions
        - sort
        - type
        - hidden
        - showInPlanner
    BreakStop:
      type: object
      properties:
        arrivalTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        departureTimestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        distanceTo:
          allOf:
          - $ref: '#/components/schemas/Distance'
        travelDurationTo:
          allOf:
          - $ref: '#/components/schemas/Duration'
        duration:
          allOf:
          - $ref: '#/components/schemas/Duration'
        locationInfo:
          allOf:
          - $ref: '#/components/schemas/BreakStopLocationInfo'
        isPaid:
          type: boolean
          example: true
        tripNumber:
          type: number
          example: 280
        entityKey:
          type: integer
          description: The stop entity key.
          example: 101
      x-omni-valid:
        AlwaysRequired:
        - duration
        CalculatedReadonly:
        - arrivalTimestamp
        - departureTimestamp
        - distanceTo
        - travelDurationTo
        - locationInfo
        - tripNumber
        - entityKey
        PostPutPatchOptional:
        - isPaid
    Country:
      type: string
      description: Standard 3-letter country code (ISO 3166-1 alpha-3)
      example: USA
      enum:
      - USA
      - CAN
      - MEX
    Address:
      type: object
      properties:
        addressLine1:
          type: string
          example: 849 Fairmount
        addressLine2:
          type: string
          example: Ave
        city:
          type: string
          example: Towson
        county:
          type: string
          example: default
        stateOrProvince:
          type: string
          description: When posting or updating (POST, PUT, PATCH), both the standard 2-letter abbreviation or the complete name for state or province can be provided ("AZ"/"Arizona").
          example: MD
        postalCode:
          type: string
          example: 21286
        country:
          $ref: '#/components/schemas/Country'
      x-omni-valid:
        PostPutPatchOptional:
        - addressLine1
        - addressLine2
        - stateOrProvince
        - county
        - city
        - country
        PostalCode:
        - postalCode
