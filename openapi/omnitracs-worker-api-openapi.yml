        - workerIdentity
        - equipmentIdentity
        - speedRpmMatrix
        - dataContext
        - items
    WeeklyTimes:
      type: object
      description: includes info pertaining to the driver's remaining and accumulated time for the current week
      properties:
        accumulatedDutyTime:
          $ref: '#/components/schemas/Duration'
        remainingDutyTime:
          $ref: '#/components/schemas/Duration'
        availableTimeTomorrow:
          $ref: '#/components/schemas/Duration'
      x-omni-valid:
        CalculatedReadonly:
        - accumulatedDutyTime
        - remainingDutyTime
        - availableTimeTomorrow
    WorkerLogs:
      type: object
      properties:
        workerInfo:
          $ref: '#/components/schemas/WorkerLogsWorkerInfo'
        equipmentInfo:
          description: 'DEPRECATED: EquipmentInfo has been superceded by EquipmentInfos. This change was made to support multiple equipment being used by a Worker in a single day. This field will be populated with LAST equipment used.'
          allOf:
          - $ref: '#/components/schemas/WorkerLogsEquipmentInfo'
        trailerInfo:
          description: 'DEPRECATED: TrailerInfo has been superceded by TrailerInfos. This change was made to support multiple trailers being used by a Worker in a single day. This field will be populated with LAST trailer used.'
          allOf:
          - $ref: '#/components/schemas/WorkerLogsEquipmentInfo'
        equipmentInfos:
          type: array
          description: EquipmentInfos is an array of all Equipment used by a worker for this log day.
          items:
            $ref: '#/components/schemas/WorkerLogsEquipmentInfo'
        trailerInfos:
          type: array
          description: TrailerInfos is an array of all Trailers used by a worker for this log day.
          items:
            $ref: '#/components/schemas/WorkerLogsEquipmentInfo'
        geospatialInfo:
          $ref: '#/components/schemas/WorkerLogsGeospatialInfo'
        detailInfo:
          type: array
          items:
            $ref: '#/components/schemas/WorkerLogsBaseDetailInfo'
        complianceInfo:
          $ref: '#/components/schemas/WorkerComplianceInfo'
        edited:
          type: boolean
          example: true
        lastResetTimestamp:
          type: string
          format: date-Time
        reportTimestamp:
          type: string
          description: The date on which the logs were generated. The returned logs correspond to those created from midnight to midnight of the given date, based on the time zone of the Drivers Primary Region.
          format: date-Time
        sensorFailure:
          type: boolean
          example: true
        shippingInformation:
          type: string
          example: shipping Information
      x-omni-valid:
        CalculatedReadonly:
        - workerInfo
        - geospatialInfo
        - detailInfo
        - complianceInfo
        - edited
        - lastResetTimestamp
        - reportTimestamp
        - sensorFailure
        - shippingInformation
        - equipmentInfos
        - trailerInfos
        DeprecatedCalculated:
        - equipmentInfo
        - trailerInfo
