security:
- tokenAuth: []
tags:
- name: Worker
  description: To help your organization maintain HOS compliance, we provide a Worker Compliance/Performance/Log service that tracks the HOS status and efficiency of your workers, while allowing you to proactively monitor your routes for any HOS issues. By having better awareness of your workers' HOS statuses through you can ensure that your HOS records remain accurate and you will be better positioned to intervene before violations occur.
paths:
  /reports/workerperformance:
    get:
      tags:
      - Worker
      summary: Worker Performance
      description: Returns various metrics pertaining to driver efficiency
      operationId: getworkerperformance
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: begindate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines a start date-time from which worker performance data after this date will be returned.
      - name: enddate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines an end date-time from which worker performance data before this date will be returned. If no value is supplied, the date will default to the time the API is called.
      responses:
        200:
          $ref: '#/components/responses/GetWorkerPerformanceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workerperformance/{entityKey}:
    get:
      tags:
      - Worker
      summary: Worker Performance by worker entity key
      description: Returns various metrics pertaining to worker efficiency
      operationId: getWorkerperformanceByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: begindate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines a start date-time from which worker performance data after this date will be returned.
      - name: enddate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines an end date-time from which worker performance data before this date will be returned. If no value is supplied, the date will default to the time the API is called.
      responses:
        200:
          $ref: '#/components/responses/GetWorkerPerformanceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/dailyworkerperformance:
    get:
      tags:
      - Worker
      summary: Daily Worker Performance
      description: Returns various metrics pertaining to driver efficiency in aggregate response
      operationId: getDailyWorkerPerformance
      parameters:
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: date
        in: query
        schema:
          type: string
          format: date
        description: Defines date from which worker performance data after this date will be returned.
      responses:
        200:
          $ref: '#/components/responses/GetDailyWorkerPerformanceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/dailyworkerperformance/{entityKey}:
    get:
      tags:
      - Worker
      summary: Daily Worker Performance by worker entity key
      description: Returns various metrics pertaining to worker efficiency in aggregate response
      operationId: getDailyWorkerPerformanceByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: date
        in: query
        schema:
          type: string
          format: date
        description: Defines date from which worker performance data after this date will be returned.
      responses:
        200:
          $ref: '#/components/responses/GetDailyWorkerPerformanceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workercompliance:
    get:
      tags:
      - Worker
      summary: Worker Compliance Status
      description: This service returns fields containing daily and weekly HOS hours calculations and other HOS status
      operationId: getWorkerCompliance
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: yesterday
        in: query
        schema:
          type: boolean
        description: Determines whether to include calculated times from yesterday when retrieving worker compliance.
      - name: inactiveWorkers
        in: query
        schema:
          type: boolean
        description: Optional parameter to to determine if workers that are not set to "Active" should be returned as part of the response.  Default value is "true" .
      responses:
        200:
          $ref: '#/components/responses/GetWorkerComplianceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workercompliance/{entityKey}:
    get:
      tags:
      - Worker
      summary: Worker Compliance Status by worker entity key
      description: This service returns fields containing daily and weekly HOS hours calculations and other HOS status by worker
      operationId: getWorkerComplianceByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: yesterday
        in: query
        schema:
          type: boolean
        description: Determines whether to include calculated times from yesterday when retrieving worker compliance.
      - name: inactiveWorkers
        in: query
        schema:
          type: boolean
        description: Optional parameter to to determine if workers that are not set to "Active" should be returned as part of the response.  Default value is "true" .
      responses:
        200:
          $ref: '#/components/responses/GetWorkerComplianceResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workercompliance/optimized:
    get:
      tags:
      - Worker
      summary: Worker Compliance Status Optimized
      description: Returns fields containing daily and weekly HOS hours calculations and other HOS status data. Functionally similar to the non-optimized worker compliance endpoint but with better/optimized performance. However, it does not include the response properties driveTimeYesterday, offDutyTimeYesterday, onDutyTimeYesterday, berthTimeYesterday, eightHourRestBreak, and violationTimeToday. Data from this endpoint may not line up with what is returned from the non optimized WorkerCompliance endpoints. This is due to the fact that the values are not recalculated in the compliance system on every call to improve performance.
      operationId: getWorkerComplianceOptimized
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: inactiveWorkers
        in: query
        schema:
          type: boolean
        description: Optional parameter to to determine if workers that are not set to "Active" should be returned as part of the response.  Default value is "true" .
      responses:
        200:
          $ref: '#/components/responses/GetWorkerComplianceOptimizedResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workercompliance/optimized/{entityKey}:
    get:
      tags:
      - Worker
      summary: Worker Compliance Status Optimized by worker entity key
      description: Returns fields containing daily and weekly HOS hours calculations and other HOS status data by worker. Functionally similar to the non-optimized worker compliance endpoint but with better/optimized performance. However, it does not include the response properties driveTimeYesterday, offDutyTimeYesterday, onDutyTimeYesterday, berthTimeYesterday, eightHourRestBreak, and violationTimeToday. Data from this endpoint may not line up with what is returned from the non optimized WorkerCompliance endpoints. This is due to the fact that the values are not recalculated in the compliance system on every call to improve performance.
      operationId: getWorkerComplianceOptimizedByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: inactiveWorkers
        in: query
        schema:
          type: boolean
        description: Optional parameter to to determine if workers that are not set to "Active" should be returned as part of the response.  Default value is "true" .
      responses:
        200:
          $ref: '#/components/responses/GetWorkerComplianceOptimizedResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workerlogs:
    get:
      tags:
      - Worker
      summary: Worker Log Report
      description: 'Worker log report intended to be called a couple of times per day to provide a historical list of worker HOS logs to update a customers host system.

        Note: Large numbers of workers in a company or in a single region could result in a timeout error, it''s recommended to use the region parameter to avoid this.

        Requests will attempt to retrieve data from the compliance system for up to 5 minutes before a time out is received.

        Additional retries will add additional load to the system so it is recommended to wait for the 5 minute time out period before a retry is made. Concurrent requests are also not recommended.


        **Response Notes:**

        - If no elements are found, the response body will consist of an empty object: {}

        - If elements are found, the response body will consist of an object containing an array of items: { items: [item1, item2, ...] }

        '
      operationId: getWorkerLogs
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included, however the pageSize and pageIndex will be applied to the results for each region.?For example - The customer contains 3 regions. R1 = 300 workers, R2 = 75 workers, R3 = 150 workers. The WorkerLogs request is made without a region specified, a page size of 100 and a page index of 0. The results would include - 100 workers from R1, 75 from R2 and 100 from R3. These would be added together and 275 total records would be returned. Calling this endpoint without a region is not recommended. Results will be missing if the account contains more than 2000 workers.
      - name: beginDate
        in: query
        schema:
          type: string
          format: date-time
        description: The start date for retrieving worker logs. Only logs from this date onward will be returned. The time portion of the date is ignored. This date must not exceed 30 days in the past. The date range between beginDate and endDate must not exceed 7 days. If no value is supplied, the date will default to the current time the API is called. This date will be set in UTC.
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
        description: The end date for retrieving worker logs. Only logs up to and including this date will be returned. The time portion of the date is ignored. The date range between beginDate and endDate must not exceed 7 days. If no value is supplied, the date will default to the current time the API is called. This date will be set in UTC.
      - name: workerLogExpand
        in: query
        schema:
          type: boolean
        description: Determines whether or not edits to worker logs (and other potential future things) are included
      responses:
        200:
          $ref: '#/components/responses/GetWorkerLogsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/workerlogs/{entityKey}:
    get:
      tags:
      - Worker
      summary: Worker Log Report by worker entity key
      description: 'Worker log report intended to be called a couple of times per day to provide a historical list of worker HOS logs to update a customers host system.

        Note: Requests will attempt to retrieve data from the compliance system for up to 5 minutes before a time out is received.

        Additional retries will add additional load to the system so it is recommended to wait for the 5 minute time out period before a retry is made.


        **Response Notes:**

        - If no elements are found, the response body will consist of an empty object: {}

        - If elements are found, the response body will consist of an object containing an array of items: { items: [item1, item2, ...] }

        '
      operationId: getWorkerLogByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: The number of items to return.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: beginDate
        in: query
        schema:
          type: string
          format: date-time
        description: The start date for retrieving worker logs. Only logs from this date onward will be returned. The time portion of the date is ignored. This date must not exceed 30 days in the past. The date range between beginDate and endDate must not exceed 7 days. If no value is supplied, the date will default to the current time the API is called. This date will be set in UTC.
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
        description: The end date for retrieving worker logs. Only logs up to and including this date will be returned. The time portion of the date is ignored. The date range between beginDate and endDate must not exceed 7 days. If no value is supplied, the date will default to the current time the API is called. This date will be set in UTC.
      - name: workerLogExpand
        in: query
        schema:
          type: boolean
        description: Determines whether or not edits to worker logs (and other potential future things) are included
      responses:
        200:
          $ref: '#/components/responses/GetWorkerLogsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
