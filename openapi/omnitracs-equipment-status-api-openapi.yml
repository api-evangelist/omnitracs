  x-logo:
    url: omni_RoadnetTechBanner_large.svg
  x-source-url: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/swagger.yaml
  x-documentation-url: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
