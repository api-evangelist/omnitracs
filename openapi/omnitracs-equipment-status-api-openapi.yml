security:
- tokenAuth: []
tags:
- name: Equipment Status
  description: The Equipment Status Api shows current equipment information including route, device, and location as well as telemetry information that is provided by the associated device
paths:
  /reports/equipmentstatus:
    get:
      tags:
      - Equipment Status
      summary: Equipment Status Report
      description: Current Equipment Status with Telemetry Data
      operationId: getEquipmentStatus
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentStatusExpand'
        description: Comma delimited list of fields to expand.
      responses:
        200:
          $ref: '#/components/responses/GetEquipmentStatusResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/equipmentstatus/{entityKey}:
    get:
      tags:
      - Equipment Status
      summary: Equipment Status Report By Entity Key
      description: Current Equipment Status with Telemetry Data
      operationId: getEquipmentStatusByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentStatusExpand'
        description: Comma delimited list of fields to expand.
      responses:
        200:
          $ref: '#/components/responses/GetEquipmentStatusByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
    EquipmentStatusAssociations:
      type: object
      properties:
        workerIdentity:
          description: The unique Identity of the Current Worker Operating the Equipment
          allOf:
          - $ref: '#/components/schemas/Identity'
        coWorkerIdentity:
          description: The unique Identity of the secondary Worker Operating the Equipment
          allOf:
          - $ref: '#/components/schemas/Identity'
        currentRegionIdentity:
          description: The unique Identity of the Region the Equipment belongs to
          allOf:
          - $ref: '#/components/schemas/Identity'
        telematicsDeviceIdentity:
          description: The unique Identity of the Telematics Device of the Equipment
          allOf:
          - $ref: '#/components/schemas/Identity'
        mobileDeviceIdentity:
          description: The unique Identity of the Mobile Device of the Equipment
          allOf:
          - $ref: '#/components/schemas/Identity'
        currentRouteIdentity:
          description: The unique Identity of the Route the Equipment is assigned to
          allOf:
          - $ref: '#/components/schemas/Identity'
      x-omni-valid:
        CalculatedReadonly:
        - workerIdentity
        - coWorkerIdentity
        - currentRegionIdentity
        - telematicsDeviceIdentity
        - mobileDeviceIdentity
        - currentRouteIdentity
    TelemetryStateInfo:
      type: object
      properties:
        ignitionKillSwitch:
          $ref: '#/components/schemas/IgnitionKillSwitch'
        accelerator:
          $ref: '#/components/schemas/Accelerator'
        panicButton:
          $ref: '#/components/schemas/PanicButton'
        temperature:
          description: Equipment Temperature
          allOf:
          - $ref: '#/components/schemas/Temperature'
        telemetryData:
          type: object
          description: Telemetry Data returned in keyvalue pairs
          additionalProperties:
            $ref: '#/components/schemas/TelemetryData'
      x-omni-valid:
        CalculatedReadonly:
        - ignitionKillSwitch
        - accelerator
        - panicButton
        - temperature
        - telemetryData
    Temperature:
      type: object
      properties:
        value:
          type: number
          example: 40
        unit:
          type: string
          example: Celsius
          enum:
          - Celsius
          - Fahrenheit
          - Kelvin
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    GetEntityResponse:
      type: object
    EquipmentDataSource:
      type: string
      example: Unknown
      enum:
      - Unknown
      - VehicleBus
      - Device
    Distance:
      type: object
      properties:
        value:
          type: number
          example: 120
        unit:
          type: string
          example: Kilometers
          enum:
          - Miles
          - Kilometers
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    EquipmentStatusContainer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentStatus'
      x-omni-valid:
        CalculatedReadonly:
        - items
    Timestamp:
      type: string
      format: date-time
    PanicButton:
      type: string
      example: Unknown
      enum:
      - Unknown
      - Inactive
      - Active
    EquipmentStatusByEntityKeyContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/EquipmentStatus'
      x-omni-valid:
        CalculatedReadonly:
        - item
    OperationalInfo:
      type: object
      properties:
        ignitionStatus:
          $ref: '#/components/schemas/IgnitionStatus'
        fuelLevel:
          description: Fuel level reported by the device. This property has been deprecated and replaced by the fuelLevelTank1 and fuelLevelTank2 properties
          allOf:
          - $ref: '#/components/schemas/LiquidVolume'
          deprecated: true
        odometer:
          description: Odometer reported by the VehicleBus or device
          allOf:
          - $ref: '#/components/schemas/EquipmentDataSourcedDistance'
        engineRunTime:
          description: Total EngineRuntime in seconds
          allOf:
          - $ref: '#/components/schemas/EquipmentDataSourcedDuration'
        lastKnownMotionState:
          type: string
          description: The Last Known Position State
          example: Unknown
          enum:
          - Unknown
          - Stopped
          - Idling
          - InMotion
          - IndeterminateStationary
        lastKnownPosition:
          type: string
          description: The Last Known Position of the Equipment in coordinate form
        lastKnownPositionText:
          type: string
          description: The Last Known Position of the Equipment in readable form
        lastKnownPositionTime:
          description: Defines a date-time from which the Last Known Position was reported.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        fuelLevelTank1:
          type: number
          description: Fuel level in percentage from tank 1 as reported by the device
          example: 100
        fuelLevelTank2:
          type: number
          description: Fuel level in percentage from tank 2 as reported by the device
          example: 100
        fuelLevelTime:
          description: Defines a date-time from which the fuel level tank 1 and 2 values were reported.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
      x-omni-valid:
        CalculatedReadonly:
        - ignitionStatus
        - fuelLevel
        - odometer
        - engineRunTime
        - lastKnownMotionState
        - lastKnownPosition
        - lastKnownPositionText
        - lastKnownPositionTime
        - fuelLevelTank1
        - fuelLevelTank2
        - fuelLevelTime
    ErrorContainer:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    EquipmentDataSourcedDistance:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Distance'
        dataSource:
          $ref: '#/components/schemas/EquipmentDataSource'
      x-omni-valid:
        CalculatedReadonly:
        - value
        - dataSource
    GetEquipmentStatusResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/EquipmentStatusContainer'
    Accelerator:
      type: string
      example: AcceleratorEnabled
      enum:
      - AcceleratorEnabled
      - EnableAcceleratorRequested
      - EnableAcceleratorRequestReceived
      - AcceleratorDisabled
      - DisableAcceleratorRequested
      - DisableAcceleratorRequestReceived
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    EquipmentDataSourcedDuration:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Duration'
        dataSource:
          $ref: '#/components/schemas/EquipmentDataSource'
      x-omni-valid:
        CalculatedReadonly:
        - value
        - dataSource
    EquipmentStatus:
      type: object
      description: Geo-spatial position information for equipment
      properties:
        identity:
          description: Equipment Identity
          allOf:
          - $ref: '#/components/schemas/Identity'
        equipmentTypeIdentity:
          description: Equipment Type Identity
          allOf:
          - $ref: '#/components/schemas/Identity'
        operationalInfo:
          description: Operational Information of the Equipment
          allOf:
          - $ref: '#/components/schemas/OperationalInfo'
        associations:
          description: Identities of associated entities
          allOf:
          - $ref: '#/components/schemas/EquipmentStatusAssociations'
        telemetryStateInfo:
          description: Telemetry data for the equipment
          allOf:
          - $ref: '#/components/schemas/TelemetryStateInfo'
        vehicleIdentificationNumber:
          type: string
          example: B6543210987654322
      x-omni-valid:
        CalculatedReadonly:
        - identity
        - equipmentTypeIdentity
        - operationalInfo
        - associations
        - telemetryStateInfo
        - vehicleIdentificationNumber
    GetEquipmentStatusByEntityKeyResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/EquipmentStatusByEntityKeyContainer'
    Duration:
      type: number
      description: Time in seconds
      example: 36000
    EquipmentStatusExpand:
      type: string
      example: All
      enum:
      - All
      - Associations
      - Telemetry
    Result:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        error:
          $ref: '#/components/schemas/Error'
    TelemetryData:
      type: object
      properties:
        value:
          type: object
        unit:
          type: string
          example: BatteryVoltage
      x-omni-valid:
        CalculatedReadonly:
        - value
        - unit
    IgnitionKillSwitch:
      type: string
      example: IgnitionEnabled
      enum:
      - IgnitionEnabled
      - EnableIgnitionRequested
      - EnableIgnitionRequestReceived
      - IgnitionDisabled
      - DisableIgnitionRequested
      - DisableIgnitionRequestReceived
    LiquidVolume:
      type: object
      properties:
        unit:
          type: string
          example: Gallons
          enum:
          - Gallons
          - Liters
          - ImperialGallons
        value:
          type: number
          example: 4343
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    IgnitionStatus:
      type: string
      example: true
      enum:
      - Unknown
      - true
      - false
  responses:
    GetEquipmentStatusResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetEquipmentStatusResponse'
        application/xml:
          schema:
            allOf:
