security:
- tokenAuth: []
tags:
- name: Cell Set
  description: A Cell Set is a collection of geographic Cells used to group Service Locations for optimized route planning. Each Cell represents a defined area where deliveries or services are organized to improve efficiency by balancing aspects of template routing and dynamic routing. Within a Cell Set, multiple Cells can be drawn or added, and routing rules can be configured to either restrict or allow routes to cross Cell boundaries.
paths:
  /admin/cellSets/:
    get:
      tags:
      - Cell Set
      summary: CellSet
      description: "Returns a list of Cell Sets. Each Cell Set contains its associated Cells, which include a `deliveryDays` field indicating the days of the week the cell accepts deliveries.\n\nAvailable EXPAND parameters are:\n  + equipmentInfo\n  + workerInfo\n"
      operationId: getCellSets
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: expand
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CellSetExpand'
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      responses:
        200:
          $ref: '#/components/responses/GetCellSetsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /admin/cellSets/{entityKey}:
    get:
      tags:
      - Cell Set
      summary: CellSet By Entity Key
      description: "Returns a single Cell Set by its entity key. The Cell Set contains its associated Cells, which include a `deliveryDays` field indicating the days of the week the cell accepts deliveries.\n\nAvailable EXPAND parameters are:\n  + equipmentInfo\n  + workerInfo\n"
      operationId: getCellSetByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: expand
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CellSetExpand'
      responses:
        200:
          $ref: '#/components/responses/GetCellSetByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
components:
  schemas:
    Entity:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        createdBy:
          type: string
          example: tester@test.com
        createdTimestamp:
          $ref: '#/components/schemas/Timestamp'
        modifiedBy:
          type: string
          example: tester@test.com
        modifiedTimestamp:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          description: Version number of the entity.  In PUT/PATCH operations, if this field is included then the number will be compared with the current version of the entity, and an error returned if they do not match.
          example: 1
      x-omni-valid:
        PrimaryIdentity:
        - identity
        SystemGeneratedReadonly:
        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    CellWorker:
      type: object
      description: The Worker assigned to the Cell's Route.
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        name:
          $ref: '#/components/schemas/PersonName'
      x-omni-valid:
        OptionalRelatedIdentity:
        - identity
        ReadonlyRelatedIdentity:
        - name
    GetEntityResponse:
      type: object
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    CellSetsContainer:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CellSet'
      x-omni-valid:
        AlwaysRequired:
        - items
    CellSetByEntityKeyContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/CellSet'
      x-omni-valid:
        AlwaysRequired:
        - item
    Timestamp:
      type: string
      format: date-time
    EquipmentIdentity:
      type: object
      properties:
        entityKey:
          type: integer
          example: 101
        identifier:
          type: string
          example: TESTIDENTIFIER
        description:
          type: string
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
        PostPutPatchOptional:
        - entityKey
        - identifier
    DayOfWeek:
      type: string
      example: Tuesday
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
    GetCellSetsResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/CellSetsContainer'
    ErrorContainer:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    Error:
      type: object
      properties:
        errorCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource was not found
    EntityKeyOnlyIdentity:
      type: object
      properties:
        entityKey:
          type: integer
          example: 101
      x-omni-valid:
        AlwaysRequired:
        - entityKey
    TimeOfDay:
      type: string
      description: Time of day in HH:MM:SS format.
      example: 36000
    GetCellSetByEntityKeyResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/GetEntityResponse'
      - $ref: '#/components/schemas/CellSetByEntityKeyContainer'
    Duration:
      type: number
      description: Time in seconds
      example: 36000
    PersonName:
      type: object
      properties:
        firstName:
          type: string
          example: Leo
        middleName:
          type: string
          example: A
        lastName:
          type: string
          example: Walker
      x-omni-valid:
        PostPutPatchOptional:
        - firstName
        - middleName
        - lastName
    EquipmentTypeRestrictions:
      type: object
      properties:
        rule:
          type: string
          example: Disallowed
          enum:
          - Disallowed
          - Allowed
        equipmentTypeIdentities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    Result:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        error:
          $ref: '#/components/schemas/Error'
    CellSet:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - type: object
        properties:
          regionIdentity:
            $ref: '#/components/schemas/EntityKeyOnlyIdentity'
          cells:
            type: array
            description: cells
            items:
              $ref: '#/components/schemas/Cell'
        x-omni-valid:
          ReadonlyRelatedIdentity: regionIdentity
          AlwaysOptional: cells
    Cell:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - type: object
        properties:
          routeId:
            type: string
            description: Unique Identifier for the Route that should be assigned to the Cell.
            example: TESTIDENTIFIER
          startTime:
            $ref: '#/components/schemas/TimeOfDay'
          preferredTime:
            $ref: '#/components/schemas/Duration'
          maximumTime:
            $ref: '#/components/schemas/Duration'
          worker:
            $ref: '#/components/schemas/CellWorker'
          equipmentAssignments:
            type: array
            description: Pieces of Equipment assigned to the Route.
            items:
              $ref: '#/components/schemas/EquipmentIdentity'
          maximumRoutes:
            type: integer
            description: The maximum number of Routes that can be created in the Cell.
            example: 1
          maxTravelTime:
            description: The maximum amount of time the driver can spend driving on a route. When routing, Roadnet Anywhere will not exceed the max travel time unless you manually add a stop to the route, or otherwise specify this time can be exceeded.
            $ref: '#/components/schemas/Duration'
          precedence:
            type: integer
            description: The priority for the Cell. This information is used if there is a Service Location that falls in more than one Cell. If Cells are being used, when routing, the Service Location is routed in the Cell that has the lower precedence.
            example: 0
          useWorkersEquipment:
            type: boolean
            description: If you want the cell's route to use the equipment associated with the worker assigned to the route
            example: false
          equipmentTypeRestriction:
            description: Determines whether you are going to specify the equipment types that are allowed to be used in the cell or whether you are going to specify the equipment types that can't be used
            allOf:
            - $ref: '#/components/schemas/EquipmentTypeRestrictions'
          deliveryDays:
            type: array
            description: 'Days of the week the cell accepts deliveries. Returned as an array of day name strings.

              An empty array means no delivery days are configured.

              '
            example:
            - Monday
            - Wednesday
            - Friday
            items:
              $ref: '#/components/schemas/DayOfWeek'
        x-omni-valid:
          PostPutPatchOptional:
          - startTime
          - preferredTime
          - maximumTime
          - precedence
          - maximumRoutes
          - maxTravelTime
          - worker
          - useWorkersEquipment
          - equipmentTypeRestriction
          OptionalRelatedIdentity:
          - routeId
          - equipmentAssignments
    CellSetExpand:
      type: string
      example: All
      enum:
      - EquipmentInfo
      - WorkerInfo
      - All
      - EquipmentTypeRestriction
  responses:
    GetCellSetsResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetCellSetsResponse'
        application/xml:
          schema:
            allOf:
            - $ref: '#/components/schemas/GetEntityResponse'
            - $ref: '#/components/schemas/CellSetsContainer'
    ErrorResponse:
      description: 'Unexpected ERROR.  Common errors are:

        + 400 - Bad request.  See response body for more detail.

        + 401 - Authentication failed or was not provided

        + 404 - Resource was not found

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorContainer'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorContainer'
    GetCellSetByEntityKeyResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetCellSetByEntityKeyResponse'
        application/xml:
          schema:
            allOf:
            - $ref: '#/components/schemas/GetEntityResponse'
            - $ref: '#/components/schemas/GetCellSetByEntityKeyResponse'
  securitySchemes:
    tokenAuth:
      type: http
      scheme: bearer
