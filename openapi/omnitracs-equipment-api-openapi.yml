security:
- tokenAuth: []
tags:
- name: Equipment
  description: Equipment are the individual pieces of equipment each worker uses every day. You can associate another piece of equipment with the existing equipment, such as associating a tractor and trailer, and then have both pieces automatically assigned to a route together. You can also associate a worker with a piece of equipment, and have that worker automatically assigned to the route with the equipment, as well as set compliance settings, and region sharing settings. If you use Telematics devices with Omnitracs One, you should appropriately assign each Telematics device to the piece of equipment it is installed in. Before creating equipment, you must have created the equipment types.
paths:
  /admin/equipment:
    get:
      tags:
      - Equipment
      summary: Equipment
      description: 'Available EXPAND parameters are:

        + Compliance

        + Operation

        + Related

        '
      operationId: getEquipment
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      responses:
        200:
          $ref: '#/components/responses/GetEquipmentResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Equipment
      summary: Equipment
      description: 'NOTE: When posting multiple Equipment at once, they must all be of a single EquipmentType

        '
      operationId: postEquipment
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - identity
                      - regionVisibility
                      - equipmentTypeIdentity
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionVisibility:
                          type: object
                          description: See [Administrative Hierarchy and Region Visibility](#section/Integration-Guidelines/Administrative-Hierarchy-and-Region-Visibility)
                          properties:
                            visibleInAllRegions:
                              type: boolean
                              example: false
                            regionIdentities:
                              type: array
                              description: Identifies which region(s) the data is organized within.
                              example:
                              - identifier: TESTBASEREGION
                              items:
                                type: object
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                        primaryRegionIdentity:
                          type: object
                          description: 'Identifies the Primary Region. Required for POST telematics devices only.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        description:
                          type: string
                          example: Equipment
                        equipmentTypeIdentity:
                          type: object
                          description: 'Equipment must be categorized by specifying an existing Equipment Type


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        active:
                          type: boolean
                          example: true
                        vehicleIdentificationNumber:
                          type: string
                          description: Required for POST and PUT when Compliance is enabled
                          example: B6543210987654321
                        retainManualVin:
                          type: boolean
                          description: Control how to update VIN
                          example: true
                        licensePlate:
                          type: string
                          example: 12345476892464587
                        manufactureDate:
                          type: string
                          format: date
                        model:
                          type: string
                          example: GMC
                        modelYear:
                          type: string
                          example: 1994
                        ownerOperated:
                          type: boolean
                          example: true
                        physical:
                          type: object
                          properties:
                            hasElectronicEngine:
                              type: boolean
                              example: true
                            auxPowerUnitType:
                              type: string
                              example: APU
                              enum:
                              - None
                              - APU
                              - BunkHeater
                              - Hybrid
                            fuelDrawCapacity:
                              type: integer
                              example: 0
                            horsepower:
                              type: integer
                              example: 0
                            numberOfPowerAxles:
                              type: integer
                              example: 0
                            transmissionManufacturer:
                              type: string
                              example: GMC
                            transmissionType:
                              type: string
                              example: Manual
                          x-omni-valid:
                            PostPutPatchOptional:
                            - hasElectronicEngine
                            - auxPowerUnitType
                            - fuelDrawCapacity
                            - horsepower
                            - numberOfPowerAxles
                            - transmissionManufacturer
                            - transmissionType
                            CalculatedReadonly:
                            - isPowerUnit
                        compliance:
                          type: object
                          properties:
                            iftaQualified:
                              type: boolean
                              example: true
                            hosExempt:
                              type: boolean
                              example: true
                            highwayUseTax:
                              type: boolean
                              example: true
                            hasBerth:
                              type: boolean
                              example: true
                            country:
                              type: string
                              description: Standard 3-letter country code (ISO 3166-1 alpha-3) from the enum
                              example: USA
                              enum:
                              - USA
                              - CAN
                            stateOrProvince:
                              type: string
                              description: When posting or updating (POST, PUT, PATCH), both the standard 2-letter abbreviation or the complete name for state or province can be provided ("AZ"/"Arizona"). When retrieving (GET), the complete name for the state or province is always returned ("Arizona").
                              example: Maryland
                            eldVehicle:
                              type: boolean
                              example: false
                            isTopLevelEntity:
                              type: boolean
                              description: When creating or updating a vehicle, if the `isTopLevelEntity` flag is explicitly set to true, the vehicle will be automatically assigned to the top-level (root) region. In this case, the `primaryRegionIdentity` values will be ignored. This behavior is only applicable for customers using region hierarchy. If region hierarchy is not enabled, the `isTopLevelEntity` flag is ignored, and the vehicle will be assigned based on the `primaryRegionIdentity` values.
                              example: false
                            regionIdentity:
                              type: object
                              description: 'Identity of the Region in which this Equipment is currently. Can only be set during POST


                                See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
                                identifier:
                                  type: string
                                  description: Represents a value that the entity can be used for identification and labeling purposes.
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                          x-omni-valid:
                            PostPutPatchOptional:
                            - iftaQualified
                            - hosExempt
                            - highwayUseTax
                            - hasBerth
                            - country
                            - stateOrProvince
                            - eldVehicle
                            - isTopLevelEntity
                            ComplianceCurrentRegionIdentity:
                            - regionIdentity
                        operational:
                          type: object
                          properties:
                            telematicsDeviceInstallDate:
                              type: string
                              format: date
                            harshDrivingThreshold:
                              type: object
                              properties:
                                equipmentClassification:
                                  type: string
                                  example: Car
                                  enum:
                                  - None
                                  - Car
                                  - Van
                                  - Pickup
                                  - WalkIn
                                  - StraightTruck
                                  - Tractor
                                acceleration:
                                  type: number
                                  example: 2
                                braking:
                                  type: number
                                  example: 10
                                cornering:
                                  type: number
                                  example: 10
                              x-omni-valid:
                                PostPutPatchOptional:
                                - equipmentClassification
                                - acceleration
                                - braking
                                - cornering
                            speedBuzzerThreshold:
                              type: object
                              required:
                              - unit
                              - value
                              properties:
                                unit:
                                  type: string
                                  example: MilesPerHour
                                  enum:
                                  - KilometersPerHour
                                  - MilesPerHour
                                value:
                                  type: number
                                  example: 10
                              x-omni-valid:
                                AlwaysRequired:
                                - value
                                - unit
                            generatedRouteDisplayNameOverride:
                              type: string
                              description: Represents the DisplayName that should be used on any Route that is generated by the system for this equipment.
                              example: TestRouteDisplayNameOverride
                          x-omni-valid:
                            PostPutPatchOptional:
                            - telematicsDeviceInstallDate
                            - harshDrivingThreshold
                            - generatedRouteDisplayNameOverride
                            - speedBuzzerThreshold
                        associations:
                          type: object
                          properties:
                            preferredWorkerIdentity:
                              type: object
                              description: 'Identity of the Worker who usually operates this Equipment. A 0 entitykey will be returned if this value is not set.


                                See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
                                identifier:
                                  type: string
                                  description: Represents a value that the entity can be used for identification and labeling purposes.
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                            buddyEquipmentIdentity:
                              type: object
                              description: 'Identity of a piece of Equipment that is operated with this Equipment. A 0 entitykey will be returned if this value is not set.


                                See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
