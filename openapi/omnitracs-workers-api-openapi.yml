security:
- tokenAuth: []
tags:
- name: Workers
  description: Workers are employees who are tracked through Omnitracs One, such as drivers, technicians, dispatchers, salespeople, and helpers. Valid Omnitracs One worker entities have records stored such as the name, phone numbers, a login for the mobile application, and pay information by accessing the system through the mobile UI, host website or any number of API's. This pay information is used to help determine the cost of a route. When adding a worker, you can assign the equipment that the worker normally uses, or the depot they usually work out of. Before workers are added, the worker type must be added.
paths:
  /admin/workers:
    get:
      tags:
      - Workers
      summary: Workers
      description: 'Available EXPAND parameters are:

        + Compliance

        + Routing

        + Confidential

        '
      operationId: getWorkers
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: regions
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Defines which Regions' results will be included in the retrieval. If omitted, results from all Regions will be included. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WorkerExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      - name: lastEntityKey
        in: query
        schema:
          type: integer
        description: Use to retrieve only results that have an entity key greater than the passed in entity key
      - name: lastModifiedDateTime
        in: query
        schema:
          type: string
          format: date-time
        description: Use to retrieve only results that were modified on or after this date-time
      responses:
        200:
          $ref: '#/components/responses/GetWorkersResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Workers
      summary: Workers
      operationId: postWorkers
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - identity
                      - regionVisibility
                      - workerTypeIdentity
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionVisibility:
                          type: object
                          description: See [Administrative Hierarchy and Region Visibility](#section/Integration-Guidelines/Administrative-Hierarchy-and-Region-Visibility)
                          properties:
                            visibleInAllRegions:
                              type: boolean
                              example: false
                            regionIdentities:
                              type: array
                              description: Identifies which region(s) the data is organized within.
                              example:
                              - identifier: TESTBASEREGION
                              items:
                                type: object
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                        primaryRegionIdentity:
                          type: object
                          description: 'Identifies the Primary Region. Required for POST telematics devices only.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        name:
                          type: object
                          description: A First and Last name is required when Compliance is enabled
                          properties:
                            firstName:
                              type: string
                              example: Leo
                            middleName:
                              type: string
                              example: A
                            lastName:
                              type: string
                              example: Walker
                          x-omni-valid:
                            PostPutPatchOptional:
                            - firstName
                            - middleName
                            - lastName
                        workerTypeIdentity:
                          type: object
                          description: 'Workers must be categorized by specifying an existing Worker Type


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        active:
                          type: boolean
                        contactNumber:
                          type: string
                        compliance:
                          type: object
                          properties:
                            license:
                              type: object
                              properties:
                                number:
                                  type: string
                                  example: 564546456
                                issuingCountry:
                                  type: string
                                  description: Standard 3-letter country code (ISO 3166-1 alpha-3)
                                  example: USA
                                  enum:
                                  - USA
                                  - CAN
                                  - MEX
                                issuingState:
                                  type: string
                                  description: When posting or updating (POST, PUT, PATCH), both the standard 2-letter abbreviation or the complete name for state or province can be provided ("AZ"/"Arizona"). When retrieving (GET), the complete name for the state or province is always returned ("Arizona").
                                  example: Alabama
                                expiration:
                                  type: string
                                  format: date
                                endorsements:
                                  type: string
                                  example: Endorser Matt
                              x-omni-valid:
                                PostPutPatchOptional:
                                - number
                                - issuingCountry
                                - issuingState
                                - expiration
                                - endorsements
                            medicalExamExpiration:
                              type: string
                              format: date
                            isComplianceEnabled:
                              type: boolean
                              description: If this worker has compliance enabled, specific HOS rules can be set for tracking the HOS information. To exempt a driver from ELD- 1) Set the isEldExempt field to true. 2) You must also provide a reason in the eldExemptExplanation field. To enable yard move- 1) if region/organization has it enabled, then set useOrganizationSettings to true 2) or set enableYardMove to true and provide a yardMoveTermination and at least one Enablerule and default rule
                              example: true
                            hosRules:
                              type: object
                              properties:
                                useOrganizationSettings:
                                  type: boolean
                                  example: false
                                enableBigDayExemption:
                                  type: boolean
                                  example: true
                                enabledRules:
                                  type: array
                                  items:
                                    type: string
                                    example: US 8/80 CA hrs.
                                defaultRule:
                                  type: string
                                  example: US 8/80 CA hrs.
                                enablePersonalConveyance:
                                  type: boolean
                                  example: true
                                allowSplitPairings:
                                  type: boolean
                                  example: true
                                willPair:
                                  type: boolean
                                  example: true
                                maxConveyanceDistance:
                                  type: number
                                  example: 3
                                defaultReportingLocationIdentity:
                                  type: object
                                  description: 'Default location for reporting HOS. Required when certain HOS rules are enabled and when Big Day Exemption is enabled. A 0 entitykey will be returned unless this property value is set when a worker is created or updated.


                                    See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                                  properties:
                                    entityKey:
                                      type: integer
                                      description: Represents the entitiy's unique identifier that is assigned by the system.
                                      example: 101
                                    identifier:
                                      type: string
                                      description: Represents a value that the entity can be used for identification and labeling purposes.
                                      example: TESTIDENTIFIER
                                  x-omni-valid:
                                    CalculatedReadonly:
                                    - description
                                enableYardMove:
                                  type: boolean
                                  example: true
                                yardMoveTermination:
                                  type: string
                                  example: PowerCycle
                                  enum:
                                  - PowerCycle
                                  - Speed
                                  - Both
                                  deprecated: true
                                isEldExempt:
                                  type: boolean
                                  example: true
                                eldExemptExplanation:
                                  type: string
                                  example: Grandfathered
                                enableAdverseWeather:
                                  type: boolean
                                  example: true
                                enablePromptForYardMove:
                                  type: boolean
                                  example: true
                                enableRestrictYardMove:
                                  type: boolean
                                  description: RestrictYardMove cannot be true if EnableYardMove is not true.
                                  example: true
                                enableYardMoveGeoFence:
                                  type: boolean
                                  example: true
                                enableYardMoveSpeed:
                                  type: boolean
                                  example: true
                                enableYardMovePowerCycle:
                                  type: boolean
                                  example: true
                              x-omni-valid:
                                OptionalRelatedIdentity:
                                - defaultReportingLocationIdentity
                                PostPutPatchOptional:
                                - useOrganizationSettings
                                - enableBigDayExemption
                                - enabledRules
                                - defaultRule
                                - enablePersonalConveyance
                                - allowSplitPairings
                                - willPair
                                - maxConveyanceDistance
                                - enableYardMove
                                - yardMoveTermination
                                - isEldExempt
                                - eldExemptExplanation
                                - enableAdverseWeather
                                - enablePromptForYardMove
                                - enableRestrictYardMove
                                - enableYardMoveGeoFence
                                - enableYardMoveSpeed
                                - enableYardMovePowerCycle
                            regionIdentity:
                              type: object
                              description: 'The driver''s current compliance reporting region


                                See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                              properties:
                                entityKey:
                                  type: integer
                                  description: Represents the entitiy's unique identifier that is assigned by the system.
                                  example: 101
                                identifier:
                                  type: string
                                  description: Represents a value that the entity can be used for identification and labeling purposes.
                                  example: TESTIDENTIFIER
                              x-omni-valid:
                                CalculatedReadonly:
                                - description
                          x-omni-valid:
                            PostPutPatchOptional:
                            - license
                            - medicalExamExpiration
                            - isComplianceEnabled
                            - hosRules
                            ComplianceCurrentRegionIdentity:
                            - regionIdentity
                        routing:
                          type: object
                          properties:
                            adjustServiceTimePercent:
                              type: integer
                              description: Increase or decrease the calculated service time by this percentage when this Worker is assigned to the Route. Valid range is -99 to 99.
                              example: 40
                            depotIdentity:
                              type: object
                              description: 'Depot where this worker usually starts their day


                                See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                              properties:
                                entityKey:
