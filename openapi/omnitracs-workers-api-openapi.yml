          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    LicenseProperties:
      type: object
      properties:
        number:
          type: string
          example: 564546456
        issuingCountry:
          $ref: '#/components/schemas/Country'
        issuingState:
          type: string
          description: When posting or updating (POST, PUT, PATCH), both the standard 2-letter abbreviation or the complete name for state or province can be provided ("AZ"/"Arizona"). When retrieving (GET), the complete name for the state or province is always returned ("Arizona").
          example: Alabama
        expiration:
          type: string
          format: date
        endorsements:
          type: string
          example: Endorser Matt
