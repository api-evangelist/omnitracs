        modifiedBy:
          type: string
          example: tester@test.com
        modifiedTimestamp:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          description: Version number of the entity.  In PUT/PATCH operations, if this field is included then the number will be compared with the current version of the entity, and an error returned if they do not match.
          example: 1
      x-omni-valid:
        PrimaryIdentity:
        - identity
        SystemGeneratedReadonly:
        - createdBy
        - createdTimestamp
        - modifiedBy
        - modifiedTimestamp
        Version:
        - version
    PerDistanceCosts:
      type: object
      properties:
        distanceRate:
          type: number
          example: 30
        minimumDistance:
          description: Minimum distance to use for cost calculation
          allOf:
          - $ref: '#/components/schemas/Distance'
      x-omni-valid:
        PostPutPatchOptional:
        - distanceRate
        - minimumDistance
    PerHourCosts:
      type: object
      properties:
        regularRate:
          type: number
          example: 6
        overtimeRate:
          type: number
          example: 7
        overtimeHoursBegin:
          description: Time duration after which the Overtime Rate is applied instead of Regular Rate
          allOf:
          - $ref: '#/components/schemas/Duration'
        minimumTime:
          description: Minimum time duration to use for cost calculation
          allOf:
          - $ref: '#/components/schemas/Duration'
      x-omni-valid:
        PostPutPatchOptional:
        - regularRate
        - overtimeRate
        - minimumTime
        - overtimeHoursBegin
