        AlwaysRequired:
        - items
    GetEntityResponse:
      type: object
    Distance:
      type: object
      properties:
        value:
          type: number
          example: 120
        unit:
          type: string
          example: Kilometers
          enum:
          - Miles
          - Kilometers
      x-omni-valid:
        AlwaysRequired:
        - value
        - unit
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
