security:
- tokenAuth: []
tags:
- name: Route Plan
  description: Route Plan has information for the stops, equipment assigned, workers, orders and its region. Information pertaining to route times and order quantities can be set and retrieved as well.
paths:
  /dailyplan/routes:
    get:
      tags:
      - Route Plan
      summary: Route Plan
      description: 'NOTE: Routes in modeling sessions are not considered.

        '
      operationId: getRoutes
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: sessionDate
        in: query
        schema:
          type: string
          format: date
        description: The Session Date for which the Route Plan is retrieved.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoutePlanExpand'
        description: Comma delimited list of fields to expand.
      - name: useHierarchy
        in: query
        schema:
          type: boolean
        description: Include all region below the region parameter
      - name: excludeResultsFromDeletedRegions
        in: query
        schema:
          type: boolean
          default: false
        description: Set to true to exclude results that belong to Regions that have been deleted.
      responses:
        200:
          $ref: '#/components/responses/GetRoutesResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    post:
      tags:
      - Route Plan
      summary: Route Plan
      operationId: postRoutes
      parameters:
      - name: applyLocationSubstitution
        in: query
        schema:
          type: boolean
        description: Apply Location Substitution for Orders in this request
      - name: setStatusToRouting
        in: query
        schema:
          type: boolean
        description: The Route Plans in the body of the request should be saved in Routing instead of Dispatch which is the default behavior
      - name: setPlanStatusToBuilt
        in: query
        schema:
          type: boolean
        description: The Route Plans in the body of the request should be saved as Build instead of Active which is the default behavior
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: 'A Route represents a set of planned work to be assigned to a driver.


                        See Integration Guidelines for usage.'
                      required:
                      - identity
                      - regionIdentity
                      - sessionIdentity
                      - equipmentInfo
                      - routeStartTime
                      - stops
                      properties:
                        identity:
                          type: object
                          description: EntityKey is ignored, Identifier is Required
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        regionIdentity:
                          type: object
                          description: 'Identifies the Region in which this data is organized.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        sessionIdentity:
                          type: object
                          properties:
                            entityKey:
                              type: integer
                              description: The routing session's EntityKey. The field is DEPRECATED for PlanningSession requests.
                              example: 101
                            date:
                              type: string
                              description: The date for the routing session must be provided when the EntityKey is omitted. The field is REQUIRED for PlanningSession requests.
                              format: date
                            description:
                              type: string
                              description: The description for the routing session must be provided with the date.
                              example: Daily
                          x-omni-valid:
                            SessionIdentity:
                            - date
                            - description
                            - entityKey
                        description:
                          type: string
                          example: Route Plan Description
                        workflowIdentity:
                          type: object
                          description: 'The driver workflow of the route.  Only relevant when the Drive app is in use.  If this field is not set, then the Region''s default workflow will be used.


                            See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)'
                          properties:
                            entityKey:
                              type: integer
                              description: Represents the entitiy's unique identifier that is assigned by the system.
                              example: 101
                            identifier:
                              type: string
                              description: Represents a value that the entity can be used for identification and labeling purposes.
                              example: TESTIDENTIFIER
                          x-omni-valid:
                            CalculatedReadonly:
                            - description
                        workersInfo:
                          type: array
                          description: Only populated if WorkersInfo EXPAND parameter is set
                          items:
                            type: object
                            required:
                            - identity
                            properties:
                              identity:
                                type: object
                                description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                properties:
                                  entityKey:
                                    type: integer
                                    description: Represents the entitiy's unique identifier that is assigned by the system.
                                    example: 101
                                  identifier:
                                    type: string
                                    description: Represents a value that the entity can be used for identification and labeling purposes.
                                    example: TESTIDENTIFIER
                                x-omni-valid:
                                  CalculatedReadonly:
                                  - description
                            x-omni-valid:
                              EmbeddedRelatedIdentity:
                              - identity
                              CalculatedReadonly:
                              - name
                        equipmentInfo:
                          type: array
                          description: Only populated if EquipmentInfo EXPAND parameter is set
                          items:
                            type: object
                            required:
                            - routeEquipmentInfoType
                            properties:
                              routeEquipmentInfoType:
                                type: string
                                example: SpecificEquipment
                                enum:
                                - SpecificEquipment
                                - EquipmentType
                              specificEquipmentInfo:
                                type: object
                                description: Required if the entity is of this type
                                required:
                                - identity
                                properties:
                                  identity:
                                    type: object
                                    description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                    properties:
                                      entityKey:
                                        type: integer
                                        description: Represents the entitiy's unique identifier that is assigned by the system.
                                        example: 101
                                      identifier:
                                        type: string
                                        description: Represents a value that the entity can be used for identification and labeling purposes.
                                        example: TESTIDENTIFIER
                                    x-omni-valid:
                                      CalculatedReadonly:
                                      - description
                                x-omni-valid:
                                  EmbeddedRelatedIdentity:
                                  - identity
                                  RequiredRelatedIdentity:
                                  - equipmentTypeIdentity
                                  CalculatedReadonly:
                                  - description
                                  - isPowerUnit
                              equipmentTypeInfo:
                                type: object
                                description: Required if the entity is of this type
                                properties:
                                  identity:
                                    type: object
                                    description: This field only returns an EntityKey in a GET request.
                                    properties:
                                      entityKey:
                                        type: integer
                                        description: Represents the entitiy's unique identifier that is assigned by the system.
                                        example: 101
                                      identifier:
                                        type: string
                                        description: Represents a value that the entity can be used for identification and labeling purposes.
                                        example: TESTIDENTIFIER
                                    x-omni-valid:
                                      CalculatedReadonly:
                                      - description
                                x-omni-valid:
                                  RouteEquipmentTypeInfoIdentity:
                                  - identity
                            x-omni-valid:
                              TypeInfo:
                              - specificEquipmentInfo
                              - equipmentTypeInfo
                              TypeDiscriminator:
                              - routeEquipmentInfoType
                        routeStartTime:
                          type: string
                          format: date-time
                        preRouteTime:
                          type: number
                          description: 'The amount of time in seconds that the driver spends at the Origin prior to departure.


                            Time in seconds'
                          example: 36000
                        postRouteTime:
                          type: number
                          description: 'The amount of time in seconds that the driver spends at the Destination after arriving.


                            Time in seconds'
                          example: 36000
                        stops:
                          type: array
                          items:
                            type: object
                            required:
                            - stopType
                            properties:
                              stopType:
                                type: string
                                description: Each stop info should be provided with one corresponding stop type.
                                example: OriginDepotStop
                                enum:
                                - OriginDepotStop
                                - DestinationDepotStop
                                - MidrouteDepotStop
                                - ServiceableStop
                                - BreakStop
                                - LayoverStop
                                - MaintenanceStop
                                - UnknownStop
                                - DiversionStop
                              workflowStopType:
                                type: string
                                description: The stop's stop type in the context of the driver workflow.  Only relevant when the Drive app is in use.  If this field is not set, then the workflow's default will be used.
                                example: WORKFLOWATOPTYPE2
                              originDepotStopInfo:
                                type: object
                                description: 'If an OriginDepotStop is planned, then only one should be provided, otherwise, the first servicable stop will be used as the origin.


                                  Required if the entity is of this type'
                                required:
                                - locationInfo
                                properties:
                                  locationInfo:
                                    type: object
                                    required:
                                    - identity
                                    properties:
                                      identity:
                                        type: object
                                        description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                        properties:
                                          entityKey:
                                            type: integer
                                            description: Represents the entitiy's unique identifier that is assigned by the system.
                                            example: 101
                                          identifier:
                                            type: string
                                            description: Represents a value that the entity can be used for identification and labeling purposes.
                                            example: TESTIDENTIFIER
                                        x-omni-valid:
                                          CalculatedReadonly:
                                          - description
                                    x-omni-valid:
                                      EmbeddedRelatedIdentity:
                                      - identity
                                      CalculatedReadonly:
                                      - description
                                      - timeZone
                                  loadAction:
                                    type: string
                                    example: AsNeeded
                                    enum:
                                    - AsNeeded
                                    - Empty
                                    - Full
                                    - None
                                x-omni-valid:
                                  PostPutPatchRequired:
                                  - locationInfo
                                  PostPutPatchOptional:
                                  - loadAction
                                  CalculatedReadonly:
                                  - departureTimestamp
                                  - runningQuantityAfter
                                  - startTimestamp
                                  - tripNumber
                              destinationDepotStopInfo:
                                type: object
                                description: 'If a DestinationDepotStop is provided, the route will end at that depot, otherwise, the route will end at the last stop.


                                  Required if the entity is of this type'
                                required:
                                - locationInfo
                                properties:
                                  locationInfo:
                                    type: object
                                    required:
                                    - identity
                                    properties:
                                      identity:
                                        type: object
                                        description: See [Identity and Related Entity Fields](#section/Integration-Guidelines/Identity-and-Related-Entity-Fields)
                                        properties:
                                          entityKey:
                                            type: integer
                                            description: Represents the entitiy's unique identifier that is assigned by the system.
                                            example: 101
