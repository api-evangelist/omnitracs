          - workflowExtensions
          PostPutPatchOptional:
          - description
          - preRouteTime
          - postRouteTime
          MonolithicChildCollection:
          - workersInfo
          - stops
          - equipmentInfo
          - workflowExtensions
          - customProperties
          PostPutRequired:
          - stops
          - equipmentInfo
          PostPutRequired_PatchOptional:
          - routeStartTime
