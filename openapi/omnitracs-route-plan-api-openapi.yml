  /dailyplan/routes/{entityKey}:
    get:
      tags:
      - Route Plan
      summary: Route Plan By Entity Key
      description: 'NOTE: Routes in modeling sessions are not considered.

        '
      operationId: getRouteByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoutePlanExpand'
        description: Comma delimited list of fields to expand.
      responses:
        200:
          $ref: '#/components/responses/GetRouteByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
    put:
      tags:
      - Route Plan
      summary: Route Plan By Entity Key
      description: Note that PUT will overwrite all fields of the entity. Use PATCH for a selective update.
      operationId: putRoute
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: applyLocationSubstitution
        in: query
        schema:
          type: boolean
        description: Apply Location Substitution for Orders in this request
      - name: setStatusToRouting
        in: query
        schema:
          type: boolean
        description: The Route Plans in the body of the request should be saved in Routing instead of Dispatch which is the default behavior
      - name: setPlanStatusToBuilt
        in: query
        schema:
          type: boolean
        description: The Route Plans in the body of the request should be saved as Build instead of Active which is the default behavior
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - item
                properties:
                  item:
                    type: object
                    description: 'A Route represents a set of planned work to be assigned to a driver.


                      See Integration Guidelines for usage.'
                    required:
                    - identity
                    - regionIdentity
                    - sessionIdentity
                    - equipmentInfo
                    - routeStartTime
                    - stops
                    properties:
                      identity:
                        type: object
                        description: Required to uniquely identify the entity (If both EntityKey and Identifier are supplied, the Identifier is updated)
                        properties:
                          entityKey:
                            type: integer
                            description: Represents the entitiy's unique identifier that is assigned by the system.
                            example: 101
                          identifier:
                            type: string
