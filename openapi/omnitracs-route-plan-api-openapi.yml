            $ref: '#/components/schemas/Timestamp'
          preRouteTime:
            description: The amount of time in seconds that the driver spends at the Origin prior to departure.
            $ref: '#/components/schemas/Duration'
          postRouteTime:
            description: The amount of time in seconds that the driver spends at the Destination after arriving.
            $ref: '#/components/schemas/Duration'
          stops:
            type: array
            items:
              $ref: '#/components/schemas/Stop'
          workflowExtensions:
            type: array
            description: Workflow Extensions for the Route. These are displayed in the Drive app for the driver as level 1 custom properties.
            items:
              $ref: '#/components/schemas/WorkflowExtension'
          routeState:
            $ref: '#/components/schemas/RouteStateType'
          customProperties:
            type: array
            description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
            items:
              $ref: '#/components/schemas/CustomProperty'
          helper:
            type: boolean
            description: Helper
            example: false
          passDescription:
            type: string
            description: passDescription
            example: Dynamic Routing
          creationMethod:
            type: string
            description: creationMethod
            example: Dynamic
