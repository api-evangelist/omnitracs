security:
- tokenAuth: []
tags:
- name: Route Actuals
  description: Route Actuals lists the routes and the drivers for a day. For each route, the payload includes planned/actual data for the number of stops, service time, travel time, non-service time (such as breaks and waits), distance traveled, mid-route depots, total route cost, and the quantities of units delivered and picked up.
paths:
  /reports/routeactuals:
    get:
      tags:
      - Route Actuals
      summary: Route actuals
      description: "Report on Route actual distances, times, and Stop/Order statuses.\n\n**Note:** When using the `beginDate` and `endDate` parameters, a route\nis included if its time span overlaps the specified window. i.e.\nit **starts** on or before `endDate` or **completes** on or after\n`beginDate`.  \n"
      operationId: getRouteActuals
      parameters:
      - name: pageIndex
        in: query
        schema:
          type: integer
          minimum: 0
        description: The 0-based page number to retrieve.  Page size is determined by the "pagesize" parameter.
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
        description: The number of items to return.
      - name: identifiers
        in: query
        style: form
        schema:
          type: array
          items:
            type: string
        description: Comma delimited list of Identifiers specifying which entities to retrieve. The query parameter total length is limited to 8192 characters. Anything greater than this will not be able to successfully complete the request.
      - name: region
        in: query
        schema:
          type: string
        description: Defines which Region's results will be included in the retrieval. If omitted, results from all Regions will be included.
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RouteActualExpand'
        description: Comma delimited list of fields to expand.
      - name: beginDate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines a start date-time from which Route Actuals after this date will be returned. This date-time refers to Route Start and Complete timestamps, not the timestamp when the Route was created. A match is returned if either the Route Start or Complete time fall between the start and end parameters inclusively.
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
        description: Defines a end date-time from which Route Actuals before this date will be returned. This date-time refers to Route Start and Complete timestamps, not the timestamp when the Route was created. A match is returned if either the Route Start or Complete time fall between the start and end parameters inclusively.
      - name: includeProjections
        in: query
        schema:
          type: boolean
        description: "Determines whether projected values should be included in the response.  When enabled, the response includes projected values for Route Timestamps  (Started, Departed, Arrived, Completed), Stop Arrival Time, Stop Departure Time,  and Stop Distance To. If this query parameter is not provided, only actual  (measured) values for these properties will be returned. \nThe projections are updated dynamically based on new measurements obtained  as the route progresses.\n"
      responses:
        200:
          $ref: '#/components/responses/GetRouteActualsResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorResponse'
          description: ''
  /reports/routeactuals/{entityKey}:
    get:
      tags:
      - Route Actuals
      summary: Route actuals by entity key
      description: Report on Route actual distances, times, and Stop/Order statuses. It can return an empty object if no Report on Route actuals exist with that entity key.
      operationId: getRouteActualByEntityKey
      parameters:
      - name: entityKey
        in: path
        required: true
        schema:
          type: integer
      - name: includeProjections
        in: query
        schema:
          type: boolean
        description: "Determines whether projected values should be included in the response.  When enabled, the response includes projected values for Route Timestamps  (Started, Departed, Arrived, Completed), Stop Arrival Time, Stop Departure Time,  and Stop Distance To. If this query parameter is not provided, only actual  (measured) values for these properties will be returned. \nThe projections are updated dynamically based on new measurements obtained  as the route progresses.\n"
      - name: expand
        in: query
        style: form
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RouteActualExpand'
        description: Comma delimited list of fields to expand.
      responses:
        200:
          $ref: '#/components/responses/GetRouteActualByEntityKeyResponse'
          description: ''
        default:
          $ref: '#/components/responses/ErrorAuthResponse'
          description: ''
components:
  schemas:
    OriginDepotStopLocationInfo:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        description:
          type: string
          example: Origin Depot Stop Location
        timeZone:
          $ref: '#/components/schemas/TimeZone'
      x-omni-valid:
        EmbeddedRelatedIdentity:
        - identity
        CalculatedReadonly:
        - description
        - timeZone
    RouteActualTimestamps:
      type: object
      properties:
        started:
          $ref: '#/components/schemas/DataSourcedTimestamp'
        departed:
          $ref: '#/components/schemas/DataSourcedTimestamp'
        arrived:
          $ref: '#/components/schemas/DataSourcedTimestamp'
        completed:
          $ref: '#/components/schemas/DataSourcedTimestamp'
      x-omni-valid:
        CalculatedReadonly:
        - started
        - departed
        - arrived
        - completed
    MidrouteDepotStopActual:
      allOf:
      - $ref: '#/components/schemas/StopActualPlannedData'
      - type: object
        properties:
          locationInfo:
            $ref: '#/components/schemas/MidrouteDepotStopLocationInfo'
          loadAction:
            $ref: '#/components/schemas/LoadAction'
          quantities:
            $ref: '#/components/schemas/MidrouteDepotStopQuantities'
          plannedQuantities:
            $ref: '#/components/schemas/MidrouteDepotStopQuantities'
          customProperties:
            type: array
            description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
            items:
              $ref: '#/components/schemas/CustomProperty'
        x-omni-valid:
          CalculatedReadonly:
          - locationInfo
          - loadAction
          - quantities
          - plannedQuantities
          MonolithicChildCollection:
          - customProperties
    LayoverStopActual:
      allOf:
      - $ref: '#/components/schemas/StopActualPlannedData'
      - type: object
        properties:
          locationInfo:
            $ref: '#/components/schemas/LayoverStopLocationInfo'
          duration:
            $ref: '#/components/schemas/Duration'
          plannedDuration:
            $ref: '#/components/schemas/Duration'
          plannedDepartureInfo:
            description: Planned departure calculation method and time.
            allOf:
            - $ref: '#/components/schemas/DepartureInfo'
          isPaid:
            type: boolean
            example: true
        x-omni-valid:
          CalculatedReadonly:
          - isPaid
          - locationInfo
          - duration
          - plannedDuration
          - plannedDepartureInfo
    MidrouteDepotStopQuantities:
      type: object
      properties:
        runningQuantitiesAfter:
          $ref: '#/components/schemas/Quantities'
        totalDeliveryQuantities:
          $ref: '#/components/schemas/Quantities'
        totalPickupQuantities:
          $ref: '#/components/schemas/Quantities'
      x-omni-valid:
        CalculatedReadonly:
        - runningQuantitiesAfter
        - totalDeliveryQuantities
        - totalPickupQuantities
    FixedDeparture:
      type: object
      properties:
        departureTimeOfDay:
          description: Layover will complete at the specified time of day
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
      x-omni-valid:
        PostPutPatchRequired:
        - departureTimeOfDay
    RouteTotals:
      type: object
      properties:
        distance:
          $ref: '#/components/schemas/Distance'
        routeTime:
          description: Total time the Route has been in progress in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        travelTime:
          description: Total time the Route has been traveling in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
        serviceTime:
          description: Total time the Route has been servicing stops in seconds
          allOf:
          - $ref: '#/components/schemas/Duration'
      x-omni-valid:
        CalculatedReadonly:
        - distance
        - routeTime
        - travelTime
        - serviceTime
    GetEntityResponse:
      type: object
    Identity:
      type: object
      properties:
        entityKey:
          type: integer
          description: Represents the entitiy's unique identifier that is assigned by the system.
          example: 101
        identifier:
          type: string
          description: Represents a value that the entity can be used for identification and labeling purposes.
          example: TESTIDENTIFIER
        description:
          type: string
          description: 'Text that provides a description of a given entity (NOTE: not all entity types will have a description and therefore, it is considered a best practice to test if the property actually exists before attempting to access it).

            '
          example: Test Description
      x-omni-valid:
        CalculatedReadonly:
        - description
    DepartureType:
      type: string
      example: FixedDuration
      enum:
      - FixedDuration
      - FixedDeparture
      - FixedArrival
    BreakStopActual:
      allOf:
      - $ref: '#/components/schemas/StopActualPlannedData'
      - type: object
        properties:
          coordinate:
            $ref: '#/components/schemas/Coordinate'
          duration:
            $ref: '#/components/schemas/Duration'
          plannedDuration:
            $ref: '#/components/schemas/Duration'
          isPaid:
            type: boolean
            example: true
        x-omni-valid:
          CalculatedReadonly:
          - isPaid
          - coordinate
          - duration
          - plannedDuration
    RouteActualContainer:
      type: object
      properties:
        item:
          type: object
          $ref: '#/components/schemas/RouteActual'
      x-omni-valid:
        CalculatedReadonly:
        - item
    StopActualPlannedData:
      allOf:
      - $ref: '#/components/schemas/StopActualData'
      - type: object
        properties:
          plannedArrivalTimestamp:
            $ref: '#/components/schemas/Timestamp'
          plannedDepartureTimestamp:
            $ref: '#/components/schemas/Timestamp'
          plannedDistanceTo:
            $ref: '#/components/schemas/Distance'
          plannedTravelDurationTo:
            $ref: '#/components/schemas/Duration'
        x-omni-valid:
          CalculatedReadonly:
          - plannedArrivalTimestamp
          - plannedDepartureTimestamp
          - plannedDistanceTo
          - plannedTravelDurationTo
    RouteActualTotals:
      allOf:
      - $ref: '#/components/schemas/RouteTotals'
      - type: object
        properties:
          paidTime:
            type: number
            description: Total time the Route has been in progress and the Workers were paid in seconds
          unpaidTime:
            type: number
            description: Total time the Route has been in progress and the Workers were not paid in seconds
          breakTime:
            type: number
            description: Total time the Route has been at Break Stops in seconds
          waitTime:
            type: number
            description: Total time the Route has been at Stops and Waiting to begin servicing the stop in seconds
          layoverTime:
            type: number
            description: Total time the Route has been at Layover Stops in seconds
          delayTime:
            type: number
            description: Total time the Route has been at Delay Stops in seconds
          distanceOdometer:
            description: 'Total distance traveled in the Route. Determined by the vehicle''s odometer reading. The measurement can be in either miles or kilometers, depending on the selection made in the business unit.


              **NOTE:** Although the `distanceOdometer` property appears in the "plannedTotals" object, it is only ever returned in the **"totals"** object. This property reflects the actual distance traveled and cannot be determined during the planning phase.

              '
            allOf:
            - $ref: '#/components/schemas/Distance'
          distanceGps:
            description: 'Total distance traveled in the Route. Determined by the vehicle''s GPS positions. The measurement can be in either miles or kilometers, depending on the selection made in the business unit.


