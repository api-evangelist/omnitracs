        layoverStopInfo:
          description: A Layover Stop on a Route.
          allOf:
          - $ref: '#/components/schemas/LayoverStopActual'
        breakStopInfo:
          description: A Break Stop on a Route.
          allOf:
          - $ref: '#/components/schemas/BreakStopActual'
        unknownStopInfo:
          description: A Stop on a Route that was created by the system and is not associated with any known stop.
          allOf:
          - $ref: '#/components/schemas/UnknownStopActual'
        maintenanceStopInfo:
          description: A Maintenance Stop on a Route.
          allOf:
          - $ref: '#/components/schemas/MaintenanceStopActual'
        diversionStopInfo:
          description: A non-serviceable stop that is used to indicate a change to a planned route.
          allOf:
          - $ref: '#/components/schemas/DiversionStopActual'
        plannedSequence:
          type: integer
          description: PlannedSequence has been superseded by plannedSequenceNormalized. This change was made to support routes that starts at a Depot. Use of this property is discouraged, and later versions of this specification will likely remove it.
          example: 80
          deprecated: true
        sequence:
          type: integer
          description: The final sequence of the stop on the assigned route.
          example: 12
        plannedSequenceNormalized:
          type: integer
          description: The sequence of the stop on the assigned route at the time of planning. If a route starts at a Depot, then this property will add 1 to the planned sequence, otherwise it will remain the same.
          example: 10
        customProperties:
          type: array
          description: "A list of custom properties. Note: before custom properties can be used for a specific entity or object type \nit is critical they are predefined for the specific entity type in the \"Roadnet Anywhere Desktop Client\" \n(aka \"Omnitracs Routing and Dispatch\" client application) under the \"Administration / Custom Properties\" menu option. \nIf not predefined, they will not be able to be posted or retrieved.\n"
          items:
            $ref: '#/components/schemas/CustomProperty'
