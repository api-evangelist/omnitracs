    Workers are employees who are tracked through Omnitracs One, such as drivers, technicians, dispatchers,
    salespeople, and helpers. Valid Omnitracs One worker entities have records stored such as the name,
    phone numbers, a login for the mobile application, and pay information by accessing the system through
    the mobile UI, host website or any number of API's. This pay information is used to help determine
