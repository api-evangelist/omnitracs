- aid: omnitracs:omnitracs-events-api
  name: Omnitracs Events API
  description: "Events are a way for subscribers to be notified about certain route, stop, worker and\
    \ equipment events. For instance, one subscriber could receive events when a driver arrives or departs\
    \ a stop, while another subscriber could receive events when a driver logs into a mobile device. \n\
    An event subscriber must be configured through the client before any events can be retrieved.\n\n\
    **Best Practices:** Events can occur very frequently, best practice would be calling this endopoint\
    \ regularly with the **beginDate** and **endDate** parameters defined. It is also recommended to include\
    \ both the **pageIndex** and **pageSize** parameters for paging.\n\n**Region filtering:** Region filtering\
    \ is based on the event type and the **main entity** associated with each type. Only events whose\
    \ main entity is assigned or shared to the region specified will be returned.\n\nEntity-to-region\
    \ filtering mapping:\n- Events of type: `Route`, `Stop`, `DriverTask`, `SendOrders` are filtered by\
    \ the **Route's region**\n- Events of type: `IgnitionStatusChanged` are filtered by the **TelematicDevice's\
    \ region**\n- Events of type: `WorkerStatusChanged` are filtered by the **Worker's region**\n- Events\
    \ of type: `CriticalEvent` are filtered by the **Equipment's region**\n- Events of type: `FaultCode`,\
    \ available to **all regions**\n\nNote: If an event's main entity is not assigned or shared to a region,\
    \ it will be excluded from region-filtered responses."
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
  baseURL: https://apex-prod-integration.aws.roadnet.com/integration
  tags:
  - Events
  properties:
  - type: OpenAPI
    url: openapi/omnitracs-events-api-openapi.yml
