    type: APIReference
  - url: https://www.omnitracs.com/omnitracs-roadnet-platform
    type: Documentation
  description: Integration web services for the Omnitracs Roadnet routing and
    dispatch platform (route planning and optimization, orders/stops, and
    schedules). A live Swagger UI is published at the integration host, but the
    underlying operations require a provisioned integration account; the surface
    is not openly self-service. Endpoints are modeled, not mirrored from an open
    reference.
- aid: omnitracs:omnitracs-entity-management-api
  name: Omnitracs Entity Management Web Services
  tags:
  - Vehicles
  - Drivers
  - Trailers
  - Master Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://services.omnitracs.com/portalWeb/
  endpointsModeled: true
  properties:
  - url: https://www.cnrportal.com/help/otsWeb/help/en_US/documents/doc_cust_integrate-with-sp_d.pdf
    type: Documentation
  - url: https://services.omnitracs.com/portalWeb/
    type: SignupURL
  description: Services Portal entity-management web services for maintaining
    fleet master data - vehicle maintenance (add/edit), driver maintenance
    (add/edit), and trailer management, with HOS Group membership and a bulk
    importer. Also exposed as Entity Management Web Service Extensions for the
    Omnitracs One platform. Partner/customer gated; a username/password with API
    access is required. Endpoints are modeled from public integration notes.
- aid: omnitracs:omnitracs-event-subscription-api
  name: Omnitracs Event Subscription Service (ESS)
  tags:
  - Positions
  - Messages
  - HOS
  - Critical Events
  - Publish Subscribe
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://services.omnitracs.com/portalWeb/
  endpointsModeled: true
  properties:
  - url: https://www.cnrportal.com/help/otsWeb/help/en_US/documents/doc_cust_integrate-with-sp_d.pdf
    type: Documentation
  description: A publish-subscribe integration service in which Omnitracs
    applications continually publish transactions (vehicle positions/GPS, driver
    messages, Hours-of-Service logs, and critical-event / driver-coaching
    notifications) to the Integration Web Server, and back-office applications
    subscribe to and periodically request the transaction types they want. The
    Event Subscription Service delivers each transaction as a SOAP/XML package
    and expects a SOAP/XML acknowledgement. Transport is request/response
    polling over HTTPS, not a WebSocket. Partner/customer gated; endpoints are
    modeled.
