- aid: omnitracs:omnitracs-service-time-type-api
  name: Omnitracs Service Time Type API
  description: >-
    Service time types are a set of rules that define how service times should be calculated. Service
    time types help you group your service locations by a common trait, which is strictly service time.
    Service time types allow you to specify that a group of service locations have the same fixed and
    variable service times because the delivery environment is the same, such as a chain of fast-food
    restaurants or a group of grocery stores that allows a pallet drop at a loading dock. Service time
    types may be, but don't have to be, correlated directly with service location categories
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
