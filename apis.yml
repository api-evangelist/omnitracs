- aid: omnitracs:omnitracs-sku-api
  name: Omnitracs SKU API
  description: >-
    SKUs are the most specific way to define individual products. You will need to use SKUs if you are
    using line items on your orders; each line item on the order must refer to a SKU. If your orders contain
    line items, you can establish service time details for each SKU, giving you more accurate service
    times when routing. For instance, you can specify that it takes longer to deliver a keg than a case
    of 12-ounce cans, and the service time calculated for the order will reflect this difference, instead
    of basing all of the variable service time on one size.
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
  baseURL: https://apex-prod-integration.aws.roadnet.com/integration
