  properties:
  - url: >-
      https://www.cnrportal.com/help/otsWeb/help/en_US/documents/doc_cust_integrate-with-sp_d.pdf
    type: Documentation
  description: >-
    A publish-subscribe integration service in which Omnitracs applications continually publish transactions
    (vehicle positions/GPS, driver messages, Hours-of-Service logs, and critical-event / driver-coaching
    notifications) to the Integration Web Server, and back-office applications subscribe to and periodically
    request the transaction types they want. The Event Subscription Service delivers each transaction
    as a SOAP/XML package and expects a SOAP/XML acknowledgement. Transport is request/response polling
    over HTTPS, not a WebSocket. Partner/customer gated; endpoints are modeled.
