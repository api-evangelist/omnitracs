- aid: omnitracs:omnitracs-order-class-api
  name: Omnitracs Order Class API
  description: >-
    Order classes let you group several factors that affect an order's delivery, such as the service times
    and service windows, as well as the type of equipment that can be used. You can create different order
    classes for different types of tasks to be completed like delivery, merchandiser, service, etc. For
    instance, you could have an order class called DEL for delivery, which would have one set of service
    times and service windows, and another called MER for merchandisers, which would have a separate set
    of service times and service windows. Then, when you add the orders you simply specify the proper
    order class and the appropriate service times and service windows will be used.
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
  baseURL: https://apex-prod-integration.aws.roadnet.com/integration
  tags:
  - Order Class
  properties:
  - type: OpenAPI
    url: openapi/omnitracs-order-class-api-openapi.yml
- aid: omnitracs:omnitracs-orders-api
  name: Omnitracs Orders API
  description: "When saving an Order, it is crucial to specify the Order Class. The Order Class determines\
    \ the Service Times and service Windows for that Order, unless there are overrides at the Service\
    \ Location or directly on the Order itself.  \n\nAt a minimum, you must define one Order Class. However,\
    \ to facilitate adjustments in Service Times, Service Windows, and Equipment Types for different types\
    \ of Orders during routing, it is advisable to create multiple Order Classes. These classes enable\
    \ you to categorize several aspects that influence an Order's delivery, such as the Service Time,\
    \ Service Window or Equipment Type.\n\nFor example, you can create distinct Order Classes for various\
    \ tasks:\n\n- **Delivery (DEL)**: An Order Class for delivery with a specific set of service times\
    \ and windows. \n\n- **Merchandising (MER)**: A separate order class for merchandisers, featuring\
    \ different service times and windows.\n\nBy assigning the appropriate order class when adding orders,\
    \ the corresponding service times and windows are automatically applied, ensuring that each order\
    \ is handled correctly.\n\n**NOTE:** If the request to save Orders contains at least 5 items, then\
    \ the Orders will be processed by a job. If the job completes within 30 seconds, the response will\
    \ include the results, detailing the Orders that were successfully saved and any errors occurred.\
    \ If the job does not finish within 30 seconds, the response will instead provide a job key.\n\nThe\
    \ user is then required to query the API at `dailyplan/orders/jobstatus` with the job key and continue\
    \ querying until a successful status and the results are returned.\n\n**NOTE:** Concurrent requests\
    \ are allowed, but issues can arise if the requests contain Orders that access the same object such\
    \ as Routes or Unassigned Order Groups. In this case, it is recommended to place multiple Orders into\
    \ a single request to avoid these issues."
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
  baseURL: https://apex-prod-integration.aws.roadnet.com/integration
  tags:
  - Orders
  properties:
  - type: OpenAPI
    url: openapi/omnitracs-orders-api-openapi.yml
