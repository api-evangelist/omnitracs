- aid: omnitracs:omnitracs-recurring-orders-api
  name: Omnitracs Recurring Orders API
  description: >-
    When saving a recurring order, the specify the order class to determine the service times and/or service
    windows for the recurring order; otherwise, the default order class is saved with the recurring order.
    Even if the customer has location service time override or location service window override, the overrides
    are still linked to an order class.  The only exception is at the recurring order level.  An individual
    recurring order can have service time overrides and/or service window overrides. When saving a recurring
    order, a unique order number is required. You can use the service location ID as the order number.  A
    unique order number allows easy updating of cycle quantities, frequency (service pattern sets), and
    other data.  The unique order number also allows multiple recurring orders for the same service location
    in the same planning session.  For instance, service location A can have two tasks, delivery and merchandising.  You
    can add recurring order A1 for the delivery territory and add recurring order A2 for the merchandising
    territory.  Each recurring order has its own order class and frequency.
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
  baseURL: https://apex-prod-integration.aws.roadnet.com/integration
  tags:
  - Recurring Orders
  properties:
  - type: OpenAPI
    url: openapi/omnitracs-recurring-orders-api-openapi.yml
