- aid: omnitracs:omnitracs-web-services-api
  name: Omnitracs Web Services (Roadnet Platform)
  tags:
  - Routing
  - Dispatch
  - Scheduling
  - Integration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://apex-prod-integration.aws.roadnet.com/integration/api-docs/index.html
