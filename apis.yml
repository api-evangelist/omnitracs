name: Omnitracs
kind: company
description: Omnitracs is a commercial fleet management, telematics, and
  transportation-management provider, now part of Solera Inc. (acquired 2021,
  operating under Solera Fleet Solutions). Its Omnitracs One platform and the
  Omnitracs Roadnet routing platform serve roughly 15,000 fleet customers with
  ELD / Hours-of-Service compliance, telematics and GPS positioning, driver
  workflow and messaging, routing and dispatch, and video safety. Omnitracs
  exposes real integration APIs and web services (Roadnet Web Services, the
  Services Portal Entity Management web services, and the SOAP/XML Event
  Subscription Service that streams positions, messages, HOS, and critical
  events), but access is partner- and customer-account gated - there is no open,
  self-service public developer portal. API credentials (a username/password
  with API access) and the integration developer wiki are provisioned to
  contracted customers and integration partners. Endpoints documented here for
  gated surfaces are honestly modeled from public integration notes, not from an
  open reference.
